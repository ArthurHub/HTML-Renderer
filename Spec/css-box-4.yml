spec: css-box-4
title: CSS Box Model Module Level 4
url: https://www.w3.org/TR/css-box-4/
snapshot: https://www.w3.org/TR/2024/WD-css-box-4-20240804/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#box-model':
    title: 2 The CSS Box Model
    status: partial
  '#box-edges':
    title: 2.1 Boxes and Edges
    status: supported
  '#fragmentation':
    title: 2.2 Fragmentation
    status: n/a
  '#keywords':
    title: 2.3 Box-edge Keywords
    status: parsed-only
    gaps:
      - margin-box, fill-box, stroke-box and view-box are rejected, see css-box-3 '#keywords'
  '#margins':
    title: 3 Margins
    status: partial
  '#margin-physical':
    title: '3.1 Page-relative (Physical) Margin Properties: the margin-top, margin-right, margin-bottom, and margin-left properties'
    status: partial
    gaps:
      - Horizontal percentage margins resolve against the box's own width, see CSS 2.1 8.3
  '#margin-shorthand':
    title: '3.2 Margin Shorthand: the margin property'
    status: supported
  '#margin-trim':
    title: '3.3 Margins at Container Edges: the margin-trim property'
    status: unsupported
    gaps:
      - "'margin-trim' is dropped by the parser"
  '#margin-trim-block':
    title: 3.3.1 Trimming Block Container Content
    status: unsupported
  '#margin-trim-flex':
    title: 3.3.2 Trimming Flex Container Content
    status: unsupported
    gaps:
      - Flex layout isn't supported, see css-display-3
  '#margin-trim-grid':
    title: 3.3.3 Trimming Grid Container Content
    status: unsupported
    gaps:
      - Grid layout isn't supported, see css-display-3
  '#paddings':
    title: 4 Padding
    status: partial
  '#padding-physical':
    title: '4.1 Page-relative (Physical) Padding Properties: the padding-top, padding-right, padding-bottom, and padding-left properties'
    status: partial
    gaps:
      - Negative padding is applied instead of being rejected, see CSS 2.1 8.4
  '#padding-shorthand':
    title: '4.2 Padding Shorthand: the padding property'
    status: supported
  '#borders':
    title: 5 Borders
    status: supported
  '#changes':
    title: 6 Recent Changes
    status: n/a
  '#changes-since-3':
    title: 7 Changes Since CSS Level 3
    status: n/a
  '#changes-since-2':
    title: 8 Changes Since CSS Level 2
    status: n/a
  '#priv':
    title: 9 Privacy Considerations
    status: n/a
  '#sec':
    title: 10 Security Considerations
    status: n/a
