spec: css-conditional-5
title: CSS Conditional Rules Module Level 5
url: https://www.w3.org/TR/css-conditional-5/
snapshot: https://www.w3.org/TR/2025/WD-css-conditional-5-20251030/
sections:
  '#introduction':
    title: 1 Introduction
    status: n/a
  '#at-supports-ext':
    title: 2 Extensions to the @supports rule
    status: unsupported
    gaps:
      - selector(), font-tech(), font-format() and at-rule() make the @supports rule invalid
  '#support-definition-ext':
    title: 2.1 Extensions to the definition of support
    status: unsupported
  '#support-definition-ext-fonts':
    title: 2.1.1 Font techs and formats
    status: unsupported
  '#support-definition-at-rules':
    title: 2.1.2 At-rules
    status: unsupported
  '#support-definition-supports-condition-name':
    title: 2.1.3 Named conditions
    status: unsupported
    gaps:
      - An unknown named condition, (--foo), is true instead of false
  '#when-rule':
    title: '3 Generalized Conditional Rules: the @when rule'
    status: unsupported
    gaps:
      - '@when is dropped'
  '#else-rule':
    title: '4 Chained Conditionals: the @else rule'
    status: unsupported
    gaps:
      - '@else is dropped'
  '#container-queries':
    title: 5 Container Queries
    status: unsupported
  '#container-type':
    title: '5.1 Creating Query Containers: the container-type property'
    status: parsed-only
    gaps:
      - size and inline-size don't apply size containment
      - scroll-state isn't supported, the declaration is dropped
  '#container-name':
    title: '5.2 Naming Query Containers: the container-name property'
    status: unsupported
    gaps:
      - Only a quoted string is accepted, a <custom-ident> name drops the declaration
  '#container-shorthand':
    title: '5.3 Creating Named Containers: the container shorthand'
    status: unsupported
    gaps:
      - The container shorthand isn't a property, it doesn't serialize container-name and container-type
  '#container-rule':
    title: '5.4 Container Queries: the @container rule'
    status: unsupported
    gaps:
      - The rules inside @container never apply, whatever the condition
  '#animated-containers':
    title: 5.5 Animated Containers
    status: n/a
  '#container-features':
    title: 6 Container Features
    status: unsupported
  '#size-container':
