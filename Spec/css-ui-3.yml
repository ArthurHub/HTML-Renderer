spec: css-ui-3
title: CSS Basic User Interface Module Level 3 (CSS3 UI)
url: https://www.w3.org/TR/css-ui-3/
snapshot: https://www.w3.org/TR/2026/REC-css-ui-3-20260407/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#interaction':
    title: 2 Module Interactions
    status: n/a
  '#box-model':
    title: 3 Box Model addition
    status: partial
  '#box-sizing':
    title: '3.1 Changing the Box Model: the box-sizing property'
    status: partial
    gaps:
      - With 'border-box', padding and border wider than 'width' or 'height' make the content size negative instead of 0
  '#outline-props':
    title: 4 Outline properties
    status: partial
    gaps:
      - The outline is painted right after the box's border, see CSS 2.1 18.4
      - An inline broken across lines gets a separate ring per line box, see CSS 2.1 18.4
      - The outline doesn't follow the 'border-radius' curve
  '#outline':
    title: '4.1 Outlines Shorthand: the outline property'
    status: supported
  '#outline-width':
    title: '4.2 Outline Thickness: the outline-width property'
    status: partial
    gaps:
      - The initial width is 2px instead of 'medium'
  '#outline-style':
    title: '4.3 Outline Patterns: the outline-style property'
    status: partial
    gaps:
      - Only solid outlines are painted, see CSS 2.1 18.4
      - "'hidden' is accepted, see CSS 2.1 18.4"
      - "'auto' isn't accepted"
  '#outline-color':
    title: '4.4 Outline Colors: the outline-color property'
    status: partial
    gaps:
      - "'invert' is accepted and painted as currentcolor instead of being rejected"
  '#outline-offset':
    title: '4.5 Offsetting the Outline: the outline-offset property'
    status: parsed-only
  '#resizing-and-overflow':
    title: 5 Resizing & Overflow
    status: unsupported
  '#resize':
    title: '5.1 Resizing Boxes: the resize property'
    status: n/a
  '#text-overflow':
    title: '5.2 Overflow Ellipsis: the text-overflow property'
    status: parsed-only
    gaps:
      - Overflowing text is clipped
  '#pointing-keyboard':
    title: 6 Pointing Devices and Keyboards
    status: parsed-only
  '#pointer-interaction':
    title: 6.1 Pointer interaction
    status: parsed-only
  '#cursor':
    title: '6.1.1 Styling the Cursor: the cursor property'
    status: parsed-only
    gaps:
      - "'cursor' is ignored, the controls show a hand over links, an I-beam over text and the arrow elsewhere"
  '#predefined-cursors':
    title: 6.1.1.1 Predefined Cursors
    status: parsed-only
  '#canvas_cursor':
    title: 6.1.1.2 Cursor of the canvas
    status: parsed-only
  '#insertion-caret':
    title: 6.2 Insertion caret
    status: n/a
  '#keyboard':
    title: 6.3 Keyboard control
    status: n/a
