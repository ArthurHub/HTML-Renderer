spec: css-fonts-4
title: CSS Fonts Module Level 4
url: https://www.w3.org/TR/css-fonts-4/
snapshot: https://www.w3.org/TR/2026/WD-css-fonts-4-20261104/
sections:
  '#introduction':
    title: 1 Introduction
    status: n/a
  '#basic-font-props':
    title: 2 Basic Font Properties
    status: partial
  '#font-family-prop':
    title: '2.1 Font family: the font-family property'
    status: partial
    gaps:
      - The family is chosen once per element, a family without a glyph for a character doesn't fall back to the next one, see CSS 2.1 15.2
  '#font-family-name-syntax':
    title: 2.1.1 Syntax of <font-family-name>
    status: partial
    gaps:
      - A quoted generic name such as "monospace" matches the generic family instead of a family of that name
  '#generic-family-name-syntax':
    title: 2.1.2 Syntax of <generic-font-family>
    status: partial
    gaps:
      - generic() is rejected, the whole declaration is dropped
  '#system':
    title: 2.1.3 Syntax of <system-font-family-name>
    status: unsupported
    gaps:
      - System font names in the font shorthand reset the font to its initial values, see CSS 2.1 15.8
  '#font-families':
    title: 2.1.4 Relationship Between Faces and Families
    status: n/a
  '#generic-font-families':
    title: 2.1.5 Generic font families
    status: partial
    gaps:
      - serif, cursive and fantasy aren't mapped to a font, see CSS 2.1 15.3.1
      - math isn't mapped to a font, it falls back to the default font
  '#font-weight-prop':
    title: '2.2 Font weight: the font-weight property'
    status: partial
    gaps:
      - A fractional weight like 450.5 is rejected
  '#relative-weights':
    title: 2.2.1 Relative Weights
    status: partial
    gaps:
      - "'bolder' and 'lighter' add or subtract 300 instead of following the table, and are inherited as keywords, see CSS 2.1 15.6"
  '#missing-weights':
    title: 2.2.2 Missing weights
    status: supported
  '#font-width-prop':
    title: '2.3 Font width: the font-width property'
    status: partial
    gaps:
      - The font-width property isn't recognized, only its legacy name font-stretch
      - Percentages aren't accepted, only the keywords
  '#font-stretch-prop':
    title: '2.3.1 Font width: the font-stretch legacy name alias'
    status: supported
  '#font-style-prop':
    title: '2.4 Font style: the font-style property'
    status: partial
    gaps:
      - "'oblique <angle>' is rendered upright, only 'oblique' alone selects the slanted face"
      - "'left' and 'right' aren't accepted"
      - Oblique angles outside -90deg to 90deg aren't rejected
  '#font-size-prop':
    title: '2.5 Font size: the font-size property'
    status: partial
    gaps:
      - "'xxx-large' and 'math' aren't accepted"
      - "'larger' and 'smaller' compound in descendants, negative sizes aren't rejected and sizes of 1pt or less become 'medium', see CSS 2.1 15.7"
  '#absolute-size-mapping':
    title: 2.5.1 Absolute Size Keyword Mapping Table
    status: partial
    gaps:
      - The keywords step 1 to 4pt away from an 11pt 'medium' instead of following the scaling factors
  '#font-size-adjust-prop':
    title: '2.6 Relative sizing: the font-size-adjust property'
    status: parsed-only
  '#font-prop':
    title: '2.7 Shorthand font property: the font property'
    status: partial
    gaps:
      - System fonts reset the font instead of using the system's font, see CSS 2.1 15.8
  '#font-synthesis-intro':
    title: 2.8 Controlling synthetic faces
    status: unsupported
  '#font-synthesis-weight':
    title: '2.8.1 Controlling synthesized bold: The font-synthesis-weight property'
    status: unsupported
  '#font-synthesis-style':
    title: '2.8.2 Controlling synthesized oblique: The font-synthesis-style property'
    status: unsupported
  '#font-synthesis-small-caps':
    title: '2.8.3 Controlling synthesized small caps: The font-synthesis-small-caps property'
    status: unsupported
  '#font-synthesis-position':
    title: '2.8.4 Controlling synthesized super- and subscripts: The font-synthesis-position property'
    status: unsupported
  '#font-synthesis':
    title: '2.8.5 Controlling synthetic faces: the font-synthesis shorthand'
    status: unsupported
  '#font-rendering-controls':
    title: 3 Font Rendering Controls
    status: n/a
  '#font-resources':
    title: 4 Font Resources
    status: partial
  '#font-face-rule':
    title: 4.1 The @font-face rule
    status: supported
  '#font-family-desc':
    title: '4.2 Font family: the font-family descriptor'
    status: supported
  '#src-desc':
    title: '4.3 Font reference: the src descriptor'
    status: partial
  '#font-face-src-parsing':
    title: 4.3.1 Parsing the src descriptor
    status: supported
  '#font-face-src-loading':
    title: 4.3.2 Loading an individual item in the src descriptor
    status: supported
  '#font-face-src-formats':
    title: 4.3.3 Selecting items in the src
    status: partial
    gaps:
      - format() and tech() are ignored, every item is fetched in turn until one loads
  '#local-font-fallback':
    title: 4.3.3.1 Local font fallback
    status: partial
    gaps:
      - local() is matched against family names, not full font names or PostScript names
  '#font-prop-desc':
    title: '4.4 Font property descriptors: the font-style, font-weight, and font-width descriptors'
    status: partial
    gaps:
      - "Ranges (font-weight: 100 900) are dropped, the face matches as weight 400"
  '#font-stretch-desc':
    title: '4.4.1 Font width: the font-stretch legacy name alias'
    status: supported
  '#unicode-range-desc':
    title: '4.5 Character range: the unicode-range descriptor'
    status: partial
    gaps:
      - The face is chosen once per element from its first non-white-space character, not per character
  '#composite-fonts':
    title: 4.5.1 Using character ranges to define composite fonts
    status: n/a
  '#font-rend-desc':
    title: '4.6 Font features and variations: the font-feature-settings and font-variation-settings descriptors'
    status: unsupported
  '#font-named-instance':
    title: '4.7 Using named instances from variable fonts: the font-named-instance descriptor'
    status: unsupported
  '#font-requests':
    title: 4.8 Font request guidelines
    status: n/a
  '#font-face-loading':
    title: 4.8.1 Font loading guidelines
    status: unsupported
    gaps:
      - Every @font-face rule is loaded while the document is parsed, also when no element uses the family
  '#font-display-desc':
    title: '4.9 Controlling Font Display Per Font-Face: the font-display descriptor'
    status: n/a
  '#font-display-font-feature-values':
    title: 4.9.1 Controlling Font Display Per Font-Family via @font-feature-values
    status: unsupported
  '#font-language-override-desc':
    title: '4.10 Default font language overriding: the font-language-override descriptor'
    status: unsupported
  '#font-metrics-override-desc':
    title: '4.11 Default font metrics overriding: the ascent-override, descent-override and line-gap-override descriptors'
    status: unsupported
  '#font-matching-algorithm':
    title: 5 Font Matching Algorithm
    status: partial
    gaps:
      - The font is chosen once per element, not per character
  '#localized-name-matching':
    title: 5.1 Localized name matching
    status: unsupported
    gaps:
      - Family names are only matched against the names the platform lists for the installed families
  '#font-style-matching':
    title: 5.2 Matching font styles
    status: partial
    gaps:
      - font-style is matched before font-width instead of after it
  '#cluster-matching':
    title: 5.3 Cluster matching
    status: unsupported
    gaps:
      - There's no per-character fallback, see CSS 2.1 15.2
  '#char-handling-issues':
    title: 5.4 Character handling issues
    status: n/a
  '#font-rend-props':
    title: 6 Font Feature Properties
    status: unsupported
  '#glyph-selection-positioning':
    title: 6.1 Glyph selection and positioning
    status: n/a
  '#language-specific-support':
    title: 6.2 Language-specific display
    status: unsupported
  '#font-kerning-prop':
    title: '6.3 Kerning: the font-kerning property'
    status: unsupported
  '#horizontal-kerning':
    title: 6.3.1 Horizontal kerning
    status: unsupported
  '#vertical-kerning':
    title: 6.3.2 Vertical kerning
    status: unsupported
  '#font-variant-ligatures-prop':
    title: '6.4 Ligatures: the font-variant-ligatures property'
    status: unsupported
  '#font-variant-position-prop':
    title: '6.5 Subscript and superscript forms: the font-variant-position property'
    status: unsupported
  '#font-variant-caps-prop':
    title: '6.6 Capitalization: the font-variant-caps property'
    status: unsupported
    gaps:
      - No small capitals are synthesized, all-small-caps text keeps its case
  '#font-variant-numeric-prop':
    title: '6.7 Numerical formatting: the font-variant-numeric property'
    status: unsupported
  '#font-variant-alternates-prop':
    title: '6.8 Alternates and swashes: the font-variant-alternates property'
    status: unsupported
  '#font-feature-values':
    title: '6.9 Defining font specific alternates: the @font-feature-values rule'
    status: unsupported
  '#font-feature-values-syntax':
    title: 6.9.1 Basic syntax
    status: unsupported
  '#multi-value-features':
    title: 6.9.2 Multi-valued feature value definitions
    status: unsupported
  '#font-variant-east-asian-prop':
    title: '6.10 East Asian text rendering: the font-variant-east-asian property'
    status: unsupported
  '#font-variant-prop':
    title: '6.11 Overall shorthand for font rendering: the font-variant property'
    status: parsed-only
    gaps:
      - "'small-caps' is ignored, see CSS 2.1 15.5"
  '#font-feature-settings-prop':
    title: '6.12 Low-level font feature settings control: the font-feature-settings property'
    status: unsupported
  '#font-language-override-prop':
    title: '6.13 Font language override: the font-language-override property'
    status: unsupported
  '#font-feature-variation-resolution':
    title: 7 Font Feature and Variation Resolution
    status: unsupported
  '#default-features':
    title: 7.1 Default features
    status: unsupported
  '#feature-variation-precedence':
    title: 7.2 Feature and variation precedence
    status: unsupported
  '#feature-precedence-examples':
    title: 7.3 Feature precedence examples
    status: n/a
  '#font-variation-props':
    title: 8 Font Variation Properties
    status: unsupported
  '#font-optical-sizing-def':
    title: '8.1 Optical sizing control: the font-optical-sizing property'
    status: unsupported
  '#font-variation-settings-def':
    title: '8.2 Low-level font variation settings control: the font-variation-settings property'
    status: unsupported
  '#color-font-support':
    title: 9 Color Font Support
    status: unsupported
  '#font-palette-prop':
    title: '9.1 Controlling Color Font Palettes: The font-palette property'
    status: parsed-only
  '#font-palette-values':
    title: '9.2 User-defined font color palettes: The @font-palette-values rule'
    status: parsed-only
  '#font-family-2-desc':
    title: '9.2.1 Font family: the font-family descriptor'
    status: parsed-only
  '#base-palette-desc':
    title: '9.2.2 Specifying the base palette: the base-palette descriptor'
    status: parsed-only
  '#override-color':
    title: '9.2.3 Overriding a colors from a palette: The override-colors descriptor'
    status: parsed-only
  '#font-variant-emoji-prop':
    title: '9.3 Selecting the text presentation style: The font-variant-emoji property'
    status: unsupported
  '#font-taxonomy':
    title: 10 Font Taxonomy
    status: n/a
  '#font-technologies-formats':
    title: 11 Font Technologies and Formats
    status: unsupported
  '#font-tech-definitions':
    title: 11.1 Font tech
    status: unsupported
    gaps:
      - tech() is ignored, see 4.3.3
  '#font-format-definitions':
    title: 11.2 Font formats
    status: unsupported
