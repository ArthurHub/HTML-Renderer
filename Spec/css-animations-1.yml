spec: css-animations-1
title: CSS Animations Level 1
url: https://www.w3.org/TR/css-animations-1/
snapshot: https://www.w3.org/TR/2023/WD-css-animations-1-20230302/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#animations':
    title: 2 Animations
    status: unsupported
    gaps:
      - "Animations are never applied. The static frame is time zero, which shows a running animation's first keyframe, a backwards fill during a positive delay and a forwards fill of a 0s animation"
      - Ignoring animations is allowed only for non-interactive media like print, the controls render as screen
  '#keyframes':
    title: 3 Keyframes
    status: parsed-only
    gaps:
      - "'@keyframes' is parsed and doesn't affect other rules, its keyframes are never applied, see 2"
      - "A string name, e.g. '@keyframes \"foo\"', invalidates the rule"
      - "The names 'none' and CSS-wide keywords are accepted"
      - Keyframe selectors below 0% or above 100% are accepted
      - "'!important' declarations in a keyframe are kept"
  '#timing-functions':
    title: 3.1 Timing functions for keyframes
    status: parsed-only
  '#animation-name':
    title: 3.2 The animation-name property
    status: parsed-only
    gaps:
      - "A string name isn't accepted"
      - "A CSS-wide keyword in a list, e.g. 'foo, initial', is accepted"
  '#animation-duration':
    title: 3.3 The animation-duration property
    status: parsed-only
    gaps:
      - Negative times are accepted
  '#animation-timing-function':
    title: 3.4 The animation-timing-function property
    status: parsed-only
    gaps:
      - Only the easing functions css-easing-1 lists as supported are accepted
  '#animation-iteration-count':
    title: 3.5 The animation-iteration-count property
    status: parsed-only
  '#animation-direction':
    title: 3.6 The animation-direction property
    status: parsed-only
  '#animation-play-state':
    title: 3.7 The animation-play-state property
    status: parsed-only
  '#animation-delay':
    title: 3.8 The animation-delay property
    status: parsed-only
  '#animation-fill-mode':
    title: 3.9 The animation-fill-mode property
    status: parsed-only
  '#animation':
    title: 3.10 The animation shorthand property
    status: parsed-only
    gaps:
      - "A list item that leaves out a time other items have makes that longhand invalid, e.g. 'animation: a 1s 2s, b 3s' drops animation-delay"
  '#events':
    title: 4 Animation Events
    status: n/a
  '#interface-dom':
    title: 5 DOM Interfaces
    status: n/a
  '#priv':
    title: 6 Privacy Considerations
    status: n/a
  '#sec':
    title: 7 Security Considerations
    status: n/a
  '#changes':
    title: 8 Changes
    status: n/a
  '#acknowledgements':
    title: 9 Acknowledgements
    status: n/a
  '#other-open-issues':
    title: 10 Other open issues
    status: n/a
  '#wg-resolutions-pending':
    title: 11 Working Group Resolutions that are pending editing
    status: n/a
