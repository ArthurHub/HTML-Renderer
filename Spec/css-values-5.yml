spec: css-values-5
title: CSS Values and Units Module Level 5
url: https://www.w3.org/TR/css-values-5/
snapshot: https://www.w3.org/TR/2024/WD-css-values-5-20241111/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#textual-values':
    title: 2 Textual Data Types
    status: partial
    gaps:
      - 'Same as Level 4, see css-values-4 #textual-values'
  '#value-defs':
    title: 3 Value Definition Syntax
    status: n/a
  '#component-function-commas':
    title: 3.1.1 Commas in Function Arguments
    status: unsupported
    gaps:
      - A {} block around a comma-containing argument isn't unwrapped, the declaration is dropped
  '#css-syntax':
    title: '3.3 Specifying CSS Syntax in CSS: the <syntax> type'
    status: unsupported
    gaps:
      - The syntax descriptor of @property is stored but never parsed, registered custom properties have no effect
  '#parse-syntax':
    title: 3.3.1 Parsing as <syntax>
    status: unsupported
  '#level-4-extensions':
    title: 4 Extensions to Level 4 Value Types
    status: partial
  '#urls':
    title: '4.1 Resource Locators: the <url> type'
    status: partial
    gaps:
      - 'Same as Level 4, see css-values-4 #urls'
  '#request-url-modifiers':
    title: 4.1.1 Request URL Modifiers
    status: unsupported
    gaps:
      - 'A modifier after a quoted URL is appended to the URL, see css-values-4 #url-modifiers'
  '#position':
    title: '4.2 2D Positioning: the <position> type'
    status: partial
    gaps:
      - The x-/y-, block-/inline- and start/end keywords aren't supported, the declaration is dropped
      - "'background-position' only resolves keywords, see CSS 2.1 14.2.1"
  '#position-parsing':
    title: 4.2.1 Parsing <position>
    status: parsed-only
  '#position-serialization':
    title: 4.2.2 Serializing <position>
    status: n/a
  '#combine-positions':
    title: 4.2.3 Combination of <position>
    status: n/a
  '#progress':
    title: 5 Interpolation Progress Functional Notations
    status: unsupported
  '#progress-func':
    title: '5.1 Calculated Progress Values: the progress() notation'
    status: unsupported
  '#media-progress-func':
    title: '5.2 Media Query Progress Values: the media-progress() notation'
    status: unsupported
  '#container-progress-func':
    title: '5.3 Container Query Progress Values: the container-progress() notation'
    status: unsupported
  '#mixing':
    title: '6 Mixing and Interpolation Notations: the *-mix() family'
    status: partial
  '#progress-type':
    title: '6.1 Representing Interpolation Progress: the <progress> type'
    status: unsupported
  '#calc-mix':
    title: '6.2 Interpolated Numeric and Dimensional Values: the calc-mix() notation'
    status: unsupported
  '#color-mix':
    title: '6.3 Interpolated Color Values: the color-mix() notation'
    status: partial
    gaps:
      - 'See css-color-5 #color-mix'
  '#cross-fade':
    title: '6.4 Interpolated Image Values: the cross-fade() notation'
    status: parsed-only
    gaps:
      - 'cross-fade() is accepted but paints nothing, see css-images-4 #cross-fade-function'
  '#transform-mix':
    title: '6.5 Interpolated Transform Values: the transform-mix() notation'
    status: unsupported
  '#mix':
    title: '6.6 Interpolated Property Values: the mix() notation'
    status: unsupported
  '#value-insert':
    title: 7 Miscellaneous Value Substituting Functions
    status: partial
  '#whole-value':
    title: '7.1 Representing An Entire Property Value: the <whole-value> type'
    status: unsupported
    gaps:
      - None of the functions that take a <whole-value> are supported
  '#first-valid':
    title: '7.2 Selecting the First Supported Value: the first-valid() notation'
    status: unsupported
  '#if-notation':
    title: '7.3 Conditional Value Selection: the if() notation'
    status: unsupported
  '#toggle-notation':
    title: '7.4 Toggling Between Values: the toggle() notation'
    status: unsupported
  '#var-notation':
    title: '7.5 Custom Property References: the var() notation'
    status: partial
    gaps:
      - 'See css-variables-1 #using-variables'
  '#inherit-notation':
    title: '7.6 Inherited Value References: the inherit() notation'
    status: unsupported
  '#attr-notation':
    title: '7.7 Attribute References: the attr() notation'
    status: partial
    gaps:
      - The fallback is ignored, a missing attribute gives an empty string
      - An attr() with a <syntax> makes the declaration invalid
  '#attr-substitution':
    title: '7.7.1 Attribute Value Substitution: the attr() notation'
    status: partial
    gaps:
      - attr() only works in content, in any other property the declaration is dropped
  '#attr-security':
    title: 7.7.2 Security
    status: supported
  '#randomness':
    title: 8 Generating Random Values
    status: unsupported
  '#random':
    title: '8.1 Generating a Random Numeric Value: the random() function'
    status: unsupported
  '#random-infinities':
    title: 8.1.1 Argument Ranges
    status: unsupported
  '#random-item':
    title: '8.2 Picking a Random Item From a List: the random-item() function'
    status: unsupported
  '#random-caching':
    title: '8.3 Generating/Caching Random Values: the <random-caching-options> value'
    status: unsupported
  '#tree-counting':
    title: '9 Tree Counting Functions: the sibling-count() and sibling-index() notations'
    status: unsupported
  '#calc-size':
    title: '10 Calculating With Intrinsic Sizes: the calc-size() function'
    status: unsupported
  '#simplifying-calc-size':
    title: 10.1 Simplifying calc-size()
    status: unsupported
  '#resolving-calc-size':
    title: 10.2 Resolving calc-size()
    status: unsupported
  '#interp-calc-size':
    title: 10.3 Interpolating calc-size()
    status: n/a
  '#interpolate-size':
    title: '10.4 Interpolating sizing keywords: the interpolate-size property'
    status: n/a
    gaps:
      - Only affects transitions and animations, which never run
