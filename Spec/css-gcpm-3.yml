spec: css-gcpm-3
title: CSS Generated Content for Paged Media Module
url: https://www.w3.org/TR/css-gcpm-3/
snapshot: https://www.w3.org/TR/2024/WD-css-gcpm-3-20240125/
sections:
  '#running-headers-and-footers':
    title: 1 Running headers and footers
    status: parsed-only
    gaps:
      - Page-margin boxes aren't rendered, so nothing can show a running header or footer, see css-page-3 5
  '#named-strings':
    title: 1.1 Named strings
    status: parsed-only
  '#setting-named-strings-the-string-set-pro':
    title: 1.1.1 The string-set property
    status: parsed-only
    gaps:
      - string-set never assigns a named string, see css-content-3 2.7.1
      - A CSS-wide keyword is accepted as the name, see css-content-3 2.7.1
  '#content-function-header':
    title: 1.1.1.1 The content() function
    status: parsed-only
    gaps:
      - content() inserts nothing, see css-content-3 2.7.3
