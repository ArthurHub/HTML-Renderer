spec: css-position-4
title: CSS Positioned Layout Module Level 4
url: https://www.w3.org/TR/css-position-4/
snapshot: https://www.w3.org/TR/2025/WD-css-position-4-20251007/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#scrollable-cb':
    title: 2 Scrollable Containing Block
    status: partial
    gaps:
      - The local containing block is the content box instead of the padding box, see CSS 2.1 10.1
  '#top-layer':
    title: 3 Top Layer
    status: n/a
    gaps:
      - Elements only enter the top layer through script or popover and dialog activation, which the library doesn't have
  '#backdrop':
    title: 3.2 The ::backdrop Pseudo-Element
    status: unsupported
    gaps:
      - "::backdrop invalidates the selector, so a selector list containing it drops the whole rule"
  '#painting-order':
    title: 4 Painting Order and Stacking Contexts
    status: partial
    gaps:
      - "'z-index' is ignored and positioned boxes, floats and inline content don't paint in the specified order, see CSS 2.1 E.2"
      - The root element's background covers only the root's border box instead of the whole canvas, see CSS 2.1 E.2
  '#changes':
    title: 5 Changes
    status: n/a
