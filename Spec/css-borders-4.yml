    status: parsed-only
    gaps:
      - "'box-shadow' is parsed but never painted, see css-backgrounds-3 #box-shadow"
  '#shadow-shape':
    title: 6.6.1 Shadow Shape, Spread, and Knockout
    status: unsupported
  '#shadow-blur':
    title: 6.6.2 Blurring Shadow Edges
    status: unsupported
  '#shadow-layers':
