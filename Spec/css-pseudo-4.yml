spec: css-pseudo-4
title: CSS Pseudo-Elements Module Level 4
url: https://www.w3.org/TR/css-pseudo-4/
snapshot: https://www.w3.org/TR/2025/WD-css-pseudo-4-20250627/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#typographic-pseudos':
    title: 2 Typographic Pseudo-elements
    status: parsed-only
  '#first-line-pseudo':
    title: '2.1 First-Line Text: the ::first-line pseudo-element'
    status: parsed-only
    gaps:
      - "::first-line is accepted but its declarations never apply, see CSS 2.1 5.12.1"
  '#first-text-line':
    title: 2.1.1 Finding the First Formatted Line
    status: unsupported
  '#first-line-styling':
    title: 2.1.2 Styling the ::first-line Pseudo-element
    status: unsupported
  '#first-line-inheritance':
    title: 2.1.3 Inheritance and the ::first-line Pseudo-element
    status: unsupported
  '#first-letter-pseudo':
    title: '2.2 First-Letter Text: ::first-letter pseudo-element and its ::prefix and ::suffix children'
    status: parsed-only
    gaps:
      - "::first-letter is accepted but its declarations never apply, see CSS 2.1 5.12.2"
      - "::prefix and ::suffix invalidate the selector"
  '#first-letter-pattern':
    title: 2.2.1 First Letters and Associated Punctuation
    status: unsupported
  '#first-letter-application':
    title: 2.2.2 Finding the First-Letter Text
    status: unsupported
  '#first-letter-tree':
    title: 2.2.3 Inheritance and Box Tree Structure of the First-Letter Pseudo-elements
    status: unsupported
  '#first-letter-styling':
    title: 2.2.4 Styling the First-Letter Pseudo-elements
    status: unsupported
  '#highlight-pseudos':
    title: 3 Highlight Pseudo-elements
    status: partial
  '#highlight-selectors':
    title: '3.1 Selecting Highlighted Content: the ::selection, ::search-text, ::target-text, ::spelling-error, ::grammar-error, and ::highlight() pseudo-elements'
    status: partial
    gaps:
      - "::search-text, ::target-text, ::spelling-error, ::grammar-error and ::highlight() invalidate the selector"
  '#highlight-styling':
    title: 3.2 Styling Highlights
    status: partial
    gaps:
      - Only color and background-color apply, text-decoration, text-shadow and custom properties are ignored
  '#highlight-ua-styles':
    title: 3.3 Default UA Styles
    status: unsupported
    gaps:
      - "The default ::selection is a semi-transparent blue over the text's own color instead of Highlight and HighlightText"
  '#paired-defaults':
    title: 3.3.1 Paired Defaults
    status: unsupported
    gaps:
      - "The default background is painted even when ::selection only sets color"
  '#highlight-bounds':
    title: 3.4 Area of a Highlight
    status: supported
  '#highlight-cascade':
    title: 3.5 Cascading and Per-Element Highlight Styles
    status: unsupported
    gaps:
      - "::selection colors apply to the whole document, the part of the selector before ::selection is ignored"
  '#highlight-painting':
    title: 3.6 Painting the Highlight
    status: partial
  '#highlight-backgrounds':
    title: 3.6.1 Backgrounds
    status: supported
  '#highlight-shadows':
    title: 3.6.2 Shadows
    status: unsupported
    gaps:
      - text-shadow on ::selection is ignored
  '#highlight-text':
    title: 3.6.3 Text and Text Decorations
    status: partial
    gaps:
      - Text decorations keep their own color instead of the ::selection color
  '#highlight-replaced':
    title: 3.6.4 Replaced Elements
    status: supported
  '#highlight-security':
    title: 3.7 Security Considerations for Highlighting
    status: n/a
  '#treelike':
    title: 4 Tree-Abiding Pseudo-elements
    status: partial
  '#generated-content':
    title: '4.1 Generated Content Pseudo-elements: ::before and ::after'
    status: partial
    gaps:
      - "A block-level ::before or ::after gets no height, and one with 'content: none' still generates a box, see CSS 2.1 12.1"
      - "A replaced element like img gets ::before and ::after content"
  '#marker-pseudo':
    title: '4.2 List Markers: the ::marker pseudo-element'
    status: parsed-only
    gaps:
      - "::marker is accepted but its declarations never apply, the marker inherits from the list item"
  '#placeholder-pseudo':
    title: '4.3 Placeholder Input: the ::placeholder pseudo-element'
    status: unsupported
    gaps:
      - "::placeholder invalidates the selector"
  '#element-like':
    title: 5 Element-backed Pseudo-Elements
    status: unsupported
  '#file-selector-button-pseudo':
    title: '5.1 File Selector Button: the ::file-selector-button pseudo-element'
    status: unsupported
    gaps:
      - "::file-selector-button invalidates the selector"
  '#details-content-pseudo':
    title: '5.2 Expandable contents of details element: the ::details-content pseudo-element'
    status: unsupported
    gaps:
      - "::details-content invalidates the selector"
  '#interactions':
    title: 6 Overlapping Pseudo-element Interactions
    status: n/a
  '#cssom':
    title: 7 Additions to the CSS Object Model
    status: n/a
  '#css2-compat':
    title: 8 Compatibility Syntax
    status: supported
