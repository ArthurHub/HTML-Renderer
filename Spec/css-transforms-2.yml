    status: parsed-only
  '#three-d-transform-functions':
    title: 12.2 3D Transform Functions
    status: parsed-only
    gaps:
      - translateZ() and the z of translate3d() accept percentages, translate3d() accepts two arguments
      - perspective(none) is rejected, a negative length in perspective() is accepted
