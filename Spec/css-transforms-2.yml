  '#transform-style-property':
    title: 7 The transform-style Property
    status: parsed-only
    gaps:
      - "'transform-style' is parsed, but preserve-3d establishes neither a 3D rendering context nor a stacking context or containing block"
  '#grouping-property-values':
    title: 7.1 Grouping property values
    status: unsupported
  '#perspective-property':
    title: 8 The perspective Property
    status: parsed-only
    gaps:
      - "'perspective' is parsed, but establishes neither a perspective nor a stacking context or containing block"
      - Negative lengths are accepted
  '#perspective-origin-property':
    title: 9 The perspective-origin Property
    status: parsed-only
    gaps:
      - "'perspective-origin' is parsed, but perspective isn't applied"
      - Three- and four-value <position> forms are rejected
  '#backface-visibility-property':
    title: 10 The backface-visibility Property
    status: parsed-only
    gaps:
      - "'backface-visibility' is parsed, but nothing is rendered in 3D"
  '#svg-three-dimensional-functions':
