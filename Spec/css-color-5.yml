spec: css-color-5
title: CSS Color Module Level 5
url: https://www.w3.org/TR/css-color-5/
snapshot: https://www.w3.org/TR/2026/WD-css-color-5-20261029/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#color-syntax':
    title: 2 The <color> syntax
    status: partial
    gaps:
      - alpha() isn't supported
  '#color-mix':
    title: '3 Mixing Colors: the color-mix() Function'
    status: partial
    gaps:
      - currentcolor in color-mix() isn't resolved, the color is transparent
  '#color-mix-space':
    title: 3.1 Colorspace for mixing
    status: partial
    gaps:
      - Without an interpolation method the color is transparent instead of mixed in Oklab
      - An unknown color space is mixed in sRGB instead of making color-mix() invalid
  '#color-mix-percent-norm':
    title: 3.2 Percentage Normalization
    status: partial
    gaps:
      - Percentages below 0% or above 100% aren't rejected
  '#color-mix-result':
    title: 3.3 Calculating the Result of color-mix
    status: partial
    gaps:
      - Only exactly two colors are accepted, one or more than two make the color transparent
  '#color-mix-color-space-effect':
    title: 3.4 Effect of Mixing Color Space on color-mix
    status: n/a
  '#color-mix-with-alpha':
    title: 3.5 Effect of Non-Unity Alpha on color-mix
    status: supported
  '#relative-colors':
    title: 4 Relative Colors
    status: unsupported
    gaps:
      - Relative color syntax isn't supported, the color is transparent or the declaration dropped
  '#rcs-intro':
    title: 4.1 Processing Model for Relative Colors
    status: unsupported
  '#relative-syntax':
    title: 4.2 Relative Color Syntax
    status: supported
  '#relative-RGB':
    title: 4.3 Relative sRGB Colors
    status: unsupported
  '#relative-HSL':
    title: 4.4 Relative HSL Colors
    status: unsupported
  '#relative-HWB':
    title: 4.5 Relative HWB Colors
    status: unsupported
  '#relative-Lab':
    title: 4.6 Relative Lab Colors
    status: unsupported
  '#relative-Oklab':
    title: 4.7 Relative Oklab Colors
    status: unsupported
  '#relative-LCH':
    title: 4.8 Relative LCH Colors
    status: unsupported
  '#relative-OkLCh':
    title: 4.9 Relative OkLCh Colors
    status: unsupported
  '#relative-alpha':
    title: 4.10 Relative Alpha Colors
    status: unsupported
  '#color-function':
    title: '5 Specifying Predefined and Custom Color Spaces: the color() Function'
    status: unsupported
    gaps:
      - color() isn't supported, see CSS Color 4 10.1
  '#relative-color-function':
    title: 5.1 Relative Color-Function Colors
    status: unsupported
  '#custom-color':
    title: 5.2 Custom Color Spaces
    status: unsupported
  '#at-profile':
    title: '5.3 Specifying a Color Profile: the @color-profile at-rule'
    status: unsupported
    gaps:
      - "@color-profile is ignored"
  '#cal-cmyk':
    title: '5.4 CSS and Print: Using Calibrated CMYK and Other Printed Color Spaces'
    status: unsupported
  '#cmyk-to-lab':
    title: 5.5 Converting CMYK colors to Lab
    status: unsupported
  '#lab-to-cmyk':
    title: 5.6 Converting Lab colors to CMYK
    status: unsupported
  '#device-cmyk':
    title: '6 Uncalibrated CMYK Colors: the device-cmyk() Function'
    status: partial
    gaps:
      - Numbers instead of percentages are rejected
  '#cmyk-rgb':
    title: 6.1 Naively Converting Between Uncalibrated CMYK and sRGB-Based Color
    status: supported
  '#light-dark':
    title: '7 Reacting to the used color-scheme: the light-dark() Function'
    status: partial
    gaps:
      - "Always the light color, color-scheme is ignored, see css-color-adjust-1 #color-scheme-prop"
  '#contrast-color':
    title: '8 Dynamically specifying a text color with adequate contrast: the contrast-color() Function'
    status: unsupported
    gaps:
      - contrast-color() isn't supported, the declaration is dropped
  '#interpolation':
    title: 9 Color Interpolation
    status: partial
  '#interpolation-space':
    title: 9.1 Color Space for Interpolation
    status: partial
    gaps:
      - Custom color spaces aren't supported, and neither is display-p3-linear, see CSS Color 4 13.3
  '#resolving-color-values':
