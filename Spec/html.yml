      - The document title isn't used anywhere, e.g. not as the title of a generated PDF
  semantics.html#the-base-element:
    title: 4.2.3 The base element
    status: partial
    gaps:
      - Doesn't apply to style sheet links, their href resolves against the adapter's base URL
      - A relative href isn't resolved against the document URL, the references then fail to load
      - The first base element is used even if it has no href
  semantics.html#the-link-element:
    title: 4.2.4 The link element
    status: partial
    gaps:
      - rel is compared as a whole, a stylesheet keyword among others doesn't link a style sheet
      - title doesn't define style sheet sets, sheets with different titles all apply
  semantics.html#processing-the-media-attribute:
    title: 4.2.4.1 Processing the media attribute
    status: unsupported
    gaps:
      - media is ignored, a style sheet for other media still applies
  semantics.html#processing-the-type-attribute:
