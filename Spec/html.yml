  parsing.html#the-before-html-insertion-mode:
    title: 13.2.6.4.2 The "before html" insertion mode
    status: partial
    gaps:
      - No html element is created when its start tag is missing
  parsing.html#the-before-head-insertion-mode:
    title: 13.2.6.4.3 The "before head" insertion mode
    status: partial
    gaps:
      - No head element is created when its start tag is missing
  parsing.html#parsing-main-inhead:
    title: 13.2.6.4.4 The "in head" insertion mode
    status: partial
    gaps:
      - Body content inside head stays in the hidden head instead of closing it
  parsing.html#parsing-main-inheadnoscript:
    title: 13.2.6.4.5 The "in head noscript" insertion mode
    status: partial
    gaps:
      - Body content inside a noscript in head stays in the hidden head instead of closing it
  parsing.html#the-after-head-insertion-mode:
    title: 13.2.6.4.6 The "after head" insertion mode
    status: partial
    gaps:
      - No body element is created when its start tag is missing
  parsing.html#parsing-main-inbody:
    title: 13.2.6.4.7 The "in body" insertion mode
    status: partial
    gaps:
      - A start tag that closes an open p only does so while the p is the current element, an inline element still open inside it keeps the p open
      - center, dir, summary, listing, xmp, plaintext, li, dd and dt don't close an open p
      - li, dt and dd don't close the previous item
      - option doesn't close the previous option
      - An end tag without a matching open element closes the current element instead of being ignored
      - An end tag p without an open p doesn't insert an empty paragraph
      - embed, keygen, source, track, wbr and bgsound aren't void, the content that follows ends up inside them
      - isindex is treated as a void element
      - A col start tag outside a table creates an element instead of being ignored
      - A self-closing slash on a non-void element (<div/>) creates an empty element instead of being ignored
      - An end tag br is ignored instead of inserting a br
      - An image start tag isn't changed to img
      - U+0000 in text isn't dropped
      - A heading start tag doesn't close an open heading
      - A button start tag doesn't close an open button
      - A form start tag inside a form isn't ignored
      - An a start tag doesn't close an open a
      - No adoption agency algorithm, a misnested formatting end tag closes everything opened after it
      - Formatting elements closed implicitly aren't reopened in the following content
      - A second body start tag creates a nested body instead of adding its attributes to the first
  parsing.html#parsing-main-incdata:
    title: 13.2.6.4.8 The "text" insertion mode
    status: supported
  parsing.html#parsing-main-intable:
    title: 13.2.6.4.9 The "in table" insertion mode
    status: partial
    gaps:
      - A tr outside of a table section doesn't get an implied tbody
      - td and th outside a row don't get an implied tr
      - col outside a colgroup doesn't get an implied colgroup
      - A table start tag inside a table nests the table instead of closing the open one
