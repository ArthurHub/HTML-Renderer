    gaps:
      - A start tag that closes an open p only does so while the p is the current element, an inline element still open inside it keeps the p open
      - li, dt and dd don't close the previous item
      - option doesn't close the previous option
      - An end tag without a matching open element closes the current element instead of being ignored
