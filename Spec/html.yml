  rendering.html#rendering:
    title: 15 Rendering
    status: partial
  rendering.html#introduction-17:
    title: 15.1 Introduction
    status: n/a
  rendering.html#the-css-user-agent-style-sheet-and-presentational-hints:
    title: 15.2 The CSS user agent style sheet and presentational hints
    status: partial
    gaps:
      - Presentational hints override author style sheets, see CSS 2.1 6.4.4
      - Attributes are mapped on every element, e.g. width on div, nowrap on span or bgcolor on span
      - Legacy color values are parsed as CSS colors, so bgcolor=ff0000 or bgcolor=chucknorris are ignored
      - Dimension values with trailing garbage, e.g. width=100abc, are ignored instead of read as 100
  rendering.html#non-replaced-elements:
    title: 15.3 Non-replaced elements
    status: partial
  rendering.html#hidden-elements:
    title: 15.3.1 Hidden elements
    status: partial
    gaps:
      - The hidden attribute is ignored
      - basefont, template, datalist, noembed, noframes, rp, dialog without open and input type=hidden are displayed
  rendering.html#the-page:
    title: 15.3.2 The page
    status: partial
    gaps:
      - marginwidth, marginheight, leftmargin and topmargin on body are ignored
      - text, link, vlink and alink on body are ignored
      - The background attribute isn't wrapped in url(), so it shows no image
  rendering.html#flow-content-3:
    title: 15.3.3 Flow content
    status: partial
    gaps:
      - figcaption, figure, footer, header, legend, listing, main, plaintext, search and xmp are inline
      - listing, plaintext and xmp don't preserve white space
      - p and blockquote have 1.12em vertical margins instead of 1em, pre has 15px above and nothing below, figure has no margins
      - form has 1.12em vertical margins, it has none outside quirks mode
      - An open dialog is inline instead of an absolutely positioned, bordered block, popover is ignored
      - The wrap attribute of pre is ignored
      - div align=middle sets vertical-align instead of centering the text
      - center and div align don't align descendant blocks, see CSS 2.1 10.3.3
  rendering.html#phrasing-content-3:
    title: 15.3.4 Phrasing content
    status: partial
    gaps:
      - dfn isn't italic
      - "Links are #0055BB instead of #0000EE, also on a without href"
      - mark has no yellow background
      - abbr and acronym with a title aren't underlined
      - q has no quotation marks
      - nobr doesn't prevent wrapping
      - The clear attribute of br is ignored
      - Ruby isn't laid out, rt follows its base inline without parentheses
      - The size attribute of font is ignored
  rendering.html#bidi-rendering:
    title: 15.3.5 Bidirectional text
    status: partial
    gaps:
      - dir=auto and bdi don't take the direction of their text
      - "'unicode-bidi' is ignored, so bdo doesn't override and bdi and dir don't isolate, see CSS 2.1 9.10"
  rendering.html#sections-and-headings:
    title: 15.3.6 Sections and headings
    status: partial
    gaps:
      - article, aside, hgroup, nav and section are inline
      - h2 to h6 have the CSS 2.1 margins, e.g. .83em instead of 1em on h3, and h6 is .75em instead of .67em
  rendering.html#lists:
    title: 15.3.7 Lists
    status: partial
    gaps:
      - ol, ul and menu are indented with margin-left instead of padding-inline-start
      - The type attribute of ol, ul and li is ignored
      - reversed without a value, i.e. <ol reversed>, counts up
      - dir, dl and menu nested in a list keep their vertical margins, nested dir and menu don't switch to circle
  rendering.html#tables-2:
    title: 15.3.8 Tables
    status: partial
    gaps:
      - td and th have no 1px padding and get overflow hidden
      - "Tables and cells have a #dfdfdf border color instead of the text color"
      - th is centered also when the row's text-align isn't the initial value
      - Captions aren't rendered, see CSS 2.1 17.4.1
      - cellpadding doesn't reach th cells of a row outside a row group
      - The background attribute isn't wrapped in url(), so it shows no image
      - border gives the table and its cells solid instead of outset and inset borders, border without a value draws none
      - rules and frame are ignored
      - align=middle and align=absmiddle on rows and cells set vertical-align instead of centering the text
      - table align=left and right set text-align instead of floating, align=center doesn't center a table with a width
      - hidden on rows, row groups and columns doesn't collapse them
      - A form that's a child of table, thead, tbody, tfoot or tr is displayed
  rendering.html#margin-collapsing-quirks:
    title: 15.3.9 Margin collapsing quirks
    status: unsupported
    gaps:
      - There's no quirks mode, neither these rules nor the other quirks-mode rules of 15.3 apply
  rendering.html#form-controls:
    title: 15.3.10 Form controls
    status: partial
    gaps:
      - button and input buttons don't center their text
      - textarea doesn't preserve white space
      - button and select aren't border-box
  rendering.html#the-hr-element-2:
    title: 15.3.11 The hr element
    status: partial
    gaps:
      - hr isn't centered, has no vertical margins and isn't gray
      - align sets text-align instead of the margins
      - size sets the height including the borders, noshade is ignored and color doesn't make the border solid
  rendering.html#the-fieldset-and-legend-elements:
    title: 15.3.12 The fieldset and legend elements
    status: partial
    gaps:
      - fieldset has 1.12em vertical margins and no groove border, padding or 2px inline margins
      - legend is an inline box in the content instead of being rendered over the top border
