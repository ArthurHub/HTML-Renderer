spec: css21
title: CSS 2.1
url: https://www.w3.org/TR/CSS21/
sections:
  intro.html#q2.0:
    title: 2 Introduction to CSS 2.1
    status: n/a
  conform.html#q3.0:
    title: 3 Conformance
    status: partial
  conform.html#defs:
    title: 3.1 Definitions
    status: supported
  conform.html#conformance:
    title: 3.2 UA Conformance
    status: partial
    gaps:
      - There is no user origin, a base stylesheet given to SetHtml cascades as author style sheet
      - Alternate style sheets are never loaded, the user can't select a style sheet set
      - Author style sheets can't be turned off
  conform.html#errors:
    title: 3.3 Error conditions
    status: n/a
  conform.html#text-css:
    title: 3.4 The text/css content type
    status: supported
  syndata.html#q4.0:
    title: 4 Syntax and basic data types
    status: partial
  syndata.html#syntax:
    title: 4.1 Syntax
    status: partial
  syndata.html#tokenization:
    title: 4.1.1 Tokenization
    status: supported
  syndata.html#keywords:
    title: 4.1.2 Keywords
    status: supported
  syndata.html#vendor-keywords:
    title: 4.1.2.1 Vendor-specific extensions
    status: supported
  syndata.html#vendor-keyword-history:
    title: 4.1.2.2 Informative Historical Notes
    status: n/a
  syndata.html#characters:
    title: 4.1.3 Characters and case
    status: partial
    gaps:
      - Uppercase units, at-keywords and '!important' aren't recognized, e.g. 10PX, @MEDIA and !IMPORTANT
      - "Uppercase pseudo-class and pseudo-element names don't match, e.g. :FIRST-CHILD and ::BEFORE"
  syndata.html#statements:
    title: 4.1.4 Statements
    status: supported
  syndata.html#at-rules:
    title: 4.1.5 At-rules
    status: supported
  syndata.html#block:
    title: 4.1.6 Blocks
    status: partial
    gaps:
      - A {}-block inside a declaration value drops the declarations after it
  syndata.html#rule-sets:
    title: 4.1.7 Rule sets, declaration blocks, and selectors
    status: supported
  syndata.html#declaration:
    title: 4.1.8 Declarations and properties
    status: supported
  syndata.html#comments:
    title: 4.1.9 Comments
    status: supported
  syndata.html#parsing-errors:
    title: 4.2 Rules for handling parsing errors
    status: supported
  syndata.html#values:
    title: 4.3 Values
    status: partial
  syndata.html#numbers:
    title: 4.3.1 Integers and real numbers
    status: supported
  syndata.html#length-units:
    title: 4.3.2 Lengths
    status: partial
    gaps:
      - Negative lengths are accepted for width, height, padding, border widths, font-size and line-height instead of being ignored
  syndata.html#percentage-units:
    title: 4.3.3 Percentages
    status: partial
    gaps:
      - A percentage font-size is inherited as the percentage and applied again in each descendant
      - A percentage line-height resolves to 0 instead of a percentage of the font size
  syndata.html#uri:
    title: 4.3.4 URLs and URIs
    status: supported
  syndata.html#counter:
    title: 4.3.5 Counters
    status: partial
    gaps:
      - counter(x, none) yields the counter value instead of an empty string
      - counters() isn't accepted, the 'content' declaration is dropped
  syndata.html#color-units:
    title: 4.3.6 Colors
    status: partial
    gaps:
      - Out-of-range rgb() values aren't clipped, a negative component makes the color invalid and a percentage above 100% wraps around
      - rgb() with mixed integers and percentages or with two components isn't ignored
  syndata.html#strings:
    title: 4.3.7 Strings
    status: partial
    gaps:
      - A backslash followed by a newline in a string is kept as a line break instead of being removed
  syndata.html#unsupported-values:
    title: 4.3.8 Unsupported Values
    status: supported
  syndata.html#charset:
    title: 4.4 CSS style sheet representation
    status: partial
    gaps:
      - The @charset rule and the HTTP charset parameter are ignored, an external style sheet is decoded from its BOM or as UTF-8
  syndata.html#escaping:
    title: 4.4.1 Referring to characters not represented in a character encoding
    status: supported
  selector.html#q5.0:
    title: 5 Selectors
    status: partial
  selector.html#pattern-matching:
    title: 5.1 Pattern matching
    status: supported
  selector.html#selector-syntax:
    title: 5.2 Selector syntax
    status: partial
    gaps:
      - "Combinator chains don't backtrack: '.a > div span' fails when only an outer div is the child of .a"
  selector.html#grouping:
    title: 5.2.1 Grouping
    status: supported
  selector.html#universal-selector:
    title: 5.3 Universal selector
    status: supported
  selector.html#type-selectors:
    title: 5.4 Type selectors
    status: supported
  selector.html#descendant-selectors:
    title: 5.5 Descendant selectors
    status: supported
  selector.html#child-selectors:
    title: 5.6 Child selectors
    status: supported
  selector.html#adjacent-selectors:
    title: 5.7 Adjacent sibling selectors
    status: supported
  selector.html#attribute-selectors:
    title: 5.8 Attribute selectors
    status: partial
  selector.html#matching-attrs:
    title: 5.8.1 Matching attributes and attribute values
    status: partial
    gaps:
      - Attribute values are matched case-insensitively, e.g. [title=Foo] matches title="foo"
  selector.html#default-attrs:
    title: 5.8.2 Default attribute values in DTDs
    status: n/a
  selector.html#class-html:
    title: 5.8.3 Class selectors
    status: partial
    gaps:
      - Class names are matched case-insensitively, e.g. .Foo matches class="foo"
      - The class attribute is only split on spaces, tabs and newlines don't separate class names
  selector.html#id-selectors:
    title: 5.9 ID selectors
    status: partial
    gaps:
      - IDs are matched case-insensitively, e.g. #Foo matches id="foo"
  selector.html#pseudo-elements:
    title: 5.10 Pseudo-elements and pseudo-classes
    status: partial
    gaps:
      - "Pseudo-class names are case-sensitive, 'p:FIRST-CHILD' never matches"
      - "Pseudo-element names are case-sensitive, 'p:BEFORE' generates nothing"
  selector.html#pseudo-class-selectors:
    title: 5.11 Pseudo-classes
    status: partial
  selector.html#first-child:
    title: "5.11.1 :first-child pseudo-class"
    status: supported
  selector.html#link-pseudo-classes:
    title: 5.11.2 The link pseudo-classes
    status: supported
  selector.html#dynamic-pseudo-classes:
    title: 5.11.3 The dynamic pseudo-classes
    status: unsupported
    gaps:
      - ":hover rules are collected but never applied when the mouse is over the element, :active and :focus never match"
      - "A :hover outside the subject, e.g. 'div:hover p', matches as if the element were always hovered"
  selector.html#lang:
    title: 5.11.4 The language pseudo-class
    status: unsupported
    gaps:
      - ":lang() never matches"
  selector.html#pseudo-element-selectors:
    title: 5.12 Pseudo-elements
    status: partial
  selector.html#first-line-pseudo:
    title: 5.12.1 The :first-line pseudo-element
    status: parsed-only
    gaps:
      - ":first-line is accepted but its declarations never apply"
  selector.html#first-letter:
    title: 5.12.2 The :first-letter pseudo-element
    status: parsed-only
    gaps:
      - ":first-letter is accepted but its declarations never apply"
  selector.html#before-and-after:
    title: 5.12.3 The :before and :after pseudo-elements
    status: supported
  cascade.html#q6.0:
    title: 6 Assigning property values, Cascading, and Inheritance
    status: partial
  cascade.html#value-stages:
    title: 6.1 Specified, computed, and actual values
    status: partial
  cascade.html#specified-value:
    title: 6.1.1 Specified values
    status: supported
  cascade.html#computed-value:
    title: 6.1.2 Computed values
    status: partial
    gaps:
      - An em length declared before the element's own 'font-size' is computed against the parent's font size
  cascade.html#used-value:
    title: 6.1.3 Used values
    status: supported
  cascade.html#actual-value:
    title: 6.1.4 Actual values
    status: n/a
  cascade.html#inheritance:
    title: 6.2 Inheritance
    status: partial
    gaps:
      - A percentage 'font-size' is inherited as the percentage and compounds, instead of as the computed size
      - "'word-spacing' isn't inherited"
  cascade.html#value-def-inherit:
    title: 6.2.1 The 'inherit' value
    status: partial
    gaps:
      - "'inherit' copies the parent's specified value, so an em margin is resolved against the child's font size"
      - "'inherit' on the root element takes the value of the anonymous box around it (display: block) instead of the initial value"
  cascade.html#at-import:
    title: 6.3 The @import rule
    status: parsed-only
    gaps:
      - The imported style sheet is never loaded
      - The media list of an @import isn't evaluated
  cascade.html#cascade:
    title: 6.4 The cascade
    status: partial
  cascade.html#cascading-order:
    title: 6.4.1 Cascading order
    status: partial
    gaps:
      - The media attribute of <link> and <style> is ignored, the style sheet always applies
  cascade.html#important-rules:
    title: 6.4.2 !important rules
    status: supported
  cascade.html#specificity:
    title: 6.4.3 Calculating a selector's specificity
    status: supported
  cascade.html#preshint:
    title: 6.4.4 Precedence of non-CSS presentational hints
    status: partial
    gaps:
      - Presentational attributes are applied after the author style sheets and override them
  media.html#q7.0:
    title: 7 Media types
    status: partial
  media.html#media-intro:
    title: 7.1 Introduction to media types
    status: n/a
  media.html#media-sheets:
    title: 7.2 Specifying media-dependent style sheets
    status: partial
    gaps:
      - The media attribute of link and style elements is ignored, the style sheet applies to every media type
      - "@import rules are never loaded, so their media list has no effect"
  media.html#at-media-rule:
    title: 7.2.1 The @media rule
    status: supported
  media.html#media-types:
    title: 7.3 Recognized media types
    status: partial
    gaps:
      - A malformed entry in a media list, e.g. '3D' in '@media screen, 3D', makes the whole list not match instead of only that entry
  media.html#media-groups:
    title: 7.3.1 Media groups
    status: n/a
  box.html#box-model:
    title: 8 Box model
    status: partial
  box.html#box-dimensions:
    title: 8.1 Box dimensions
    status: supported
  box.html#mpb-examples:
    title: 8.2 Example of margins, padding, and borders
    status: n/a
  box.html#margin-properties:
    title: 8.3 Margin properties
    status: partial
    gaps:
      - Horizontal percentage margins resolve against the box's own width instead of the containing block's width
  box.html#collapsing-margins:
    title: 8.3.1 Collapsing margins
    status: supported
  box.html#padding-properties:
    title: 8.4 Padding properties
    status: partial
    gaps:
      - Negative padding is applied instead of being rejected
  box.html#border-properties:
    title: 8.5 Border properties
    status: partial
  box.html#border-width-properties:
    title: 8.5.1 Border width
    status: partial
    gaps:
      - "'border-style: hidden' keeps the border width instead of computing it to 0"
      - The initial width is 2px, while 'medium' is 3px
  box.html#border-color-properties:
    title: 8.5.2 Border color
    status: partial
    gaps:
      - The initial color is black instead of the element's 'color'
  box.html#border-style-properties:
    title: 8.5.3 Border style
    status: partial
    gaps:
      - double, groove and ridge are painted as solid
  box.html#border-shorthand-properties:
    title: 8.5.4 Border shorthand properties
    status: supported
  box.html#bidi-box-model:
    title: 8.6 The box model for inline elements in bidirectional context
    status: unsupported
    gaps:
      - A split inline box in RTL text gets its left border on the first line and its right border on the last, like in LTR
  visuren.html#q9.0:
    title: 9 Visual formatting model
    status: partial
  visuren.html#visual-model-intro:
    title: 9.1 Introduction to the visual formatting model
    status: supported
  visuren.html#viewport:
    title: 9.1.1 The viewport
    status: supported
  visuren.html#containing-block:
    title: 9.1.2 Containing blocks
    status: supported
  visuren.html#box-gen:
    title: 9.2 Controlling box generation
    status: partial
  visuren.html#block-boxes:
    title: 9.2.1 Block-level elements and block boxes
    status: supported
  visuren.html#anonymous-block-level:
    title: 9.2.1.1 Anonymous block boxes
    status: partial
    gaps:
      - The first display:none child of an inline-block is moved out of it, next to the anonymous block box around the inline-block
  visuren.html#inline-boxes:
    title: 9.2.2 Inline-level elements and inline boxes
    status: partial
    gaps:
      - "'display: inline-table' is laid out like a block, on a line of its own"
  visuren.html#anonymous:
    title: 9.2.2.1 Anonymous inline boxes
    status: supported
  visuren.html#run-in:
    title: 9.2.3 Run-in boxes
    status: n/a
  visuren.html#display-prop:
    title: 9.2.4 The 'display' property
    status: supported
  visuren.html#positioning-scheme:
    title: 9.3 Positioning schemes
    status: partial
  visuren.html#choose-position:
    title: 9.3.1 Choosing a positioning scheme
    status: supported
  visuren.html#position-props:
    title: 9.3.2 Box offsets
    status: partial
    gaps:
      - Percentage offsets of a relatively positioned box resolve against its own width or height instead of the containing block's
  visuren.html#normal-flow:
    title: 9.4 Normal flow
    status: partial
  visuren.html#block-formatting:
    title: 9.4.1 Block formatting contexts
    status: partial
    gaps:
      - Floats inside a block with overflow other than visible still shorten the line boxes after it
      - A block after a sibling with a bottom border is placed that border's width too low
  visuren.html#inline-formatting:
    title: 9.4.2 Inline formatting contexts
    status: partial
    gaps:
      - The start padding, border and margin of an inline box are repeated at the start of every line it's split onto
      - A word wider than the line box starts a new line, leaving an empty line above it
  visuren.html#relative-positioning:
    title: 9.4.3 Relative positioning
    status: partial
    gaps:
      - Relative positioning of inline boxes is ignored
      - When 'left' and 'right' are both set, 'left' wins even if the containing block is rtl
  visuren.html#floats:
    title: 9.5 Floats
    status: partial
    gaps:
      - A float inside a line, e.g. a floated span, isn't floated and stays in the line
      - A box that establishes a new block formatting context overlaps preceding floats
      - Floats paint in document order, so a later in-flow block's background covers them
  visuren.html#float-position:
    title: 9.5.1 Positioning the float
    status: partial
    gaps:
      - Successive right floats overlap instead of stacking side by side
      - A float that doesn't fit next to the previous ones moves below the lowest of them instead of as high as possible
      - A right float in a block narrower than its block formatting context is placed against an earlier right float outside that block, past its containing block's right edge
  visuren.html#flow-control:
    title: 9.5.2 Controlling flow next to floats
    status: partial
    gaps:
      - "'clear' on a float moves it down but keeps it next to the floats it clears instead of at the containing block edge"
      - "'clear' also clears floats inside earlier boxes that establish their own block formatting context"
  visuren.html#absolute-positioning:
    title: 9.6 Absolute positioning
    status: partial
    gaps:
      - The content of an absolutely positioned box flows around floats outside of it
  visuren.html#fixed-positioning:
    title: 9.6.1 Fixed positioning
    status: partial
    gaps:
      - "'right' and 'bottom' are ignored, a fixed box is always placed by 'left' and 'top'"
  visuren.html#dis-pos-flo:
    title: 9.7 Relationships between 'display', 'position', and 'float'
    status: partial
    gaps:
      - "Floated and absolutely positioned inline elements keep 'display: inline' instead of becoming block"
      - An absolutely positioned box with 'float' still acts as a float for the content after it
  visuren.html#comparison:
    title: 9.8 Comparison of normal flow, floats, and absolute positioning
    status: n/a
  visuren.html#layers:
    title: 9.9 Layered presentation
    status: partial
  visuren.html#z-index:
    title: 9.9.1 Specifying the stack level
    status: partial
    gaps:
      - "'z-index' is ignored, boxes paint in the order normal flow, absolute, fixed"
      - Relatively positioned boxes paint with the normal flow, behind later in-flow blocks
  visuren.html#direction:
    title: 9.10 Text direction
    status: partial
    gaps:
      - "No Unicode bidirectional algorithm, 'direction: rtl' reverses the order of all words on a line, left-to-right runs included"
      - "'direction' on an inline element reorders its words although 'unicode-bidi' is 'normal'"
  visudet.html#q10.0:
    title: 10 Visual formatting model details
    status: partial
  visudet.html#containing-block-details:
    title: 10.1 Definition of "containing block"
    status: partial
    gaps:
      - An absolutely positioned box is placed against the content edge of its positioned ancestor instead of the padding edge
      - Percentages on an absolutely positioned box resolve against its parent instead of its containing block
      - A block inside an inline is laid out inside the inline's padding instead of the content box of the nearest block container
  visudet.html#the-width-property:
    title: 10.2 Content width
    status: partial
    gaps:
      - Negative widths are applied instead of being rejected
  visudet.html#Computing_widths_and_margins:
    title: 10.3 Calculating widths and margins
    status: partial
  visudet.html#inline-width:
    title: 10.3.1 Inline, non-replaced elements
    status: partial
    gaps:
      - "'width' is applied to non-replaced inline boxes, it widens the box on the line"
  visudet.html#inline-replaced-width:
    title: 10.3.2 Inline, replaced elements
    status: partial
    gaps:
      - Widths in units other than px and % are ignored, the image keeps its intrinsic width
  visudet.html#blockwidth:
    title: 10.3.3 Block-level, non-replaced elements in normal flow
    status: partial
    gaps:
      - Auto margins compute to 0, a block with a width is never centered or pushed right by them
      - In RTL, an over-constrained block ignores 'margin-right' instead of 'margin-left'
  visudet.html#block-replaced-width:
    title: 10.3.4 Block-level, replaced elements in normal flow
    status: partial
    gaps:
      - Auto margins compute to 0, a block image is never centered by them
  visudet.html#float-width:
    title: 10.3.5 Floating, non-replaced elements
    status: partial
    gaps:
      - The shrink-to-fit width of an auto width float is computed before its content is measured, on the first layout it's 0 or NaN and the text wraps after every word
  visudet.html#float-replaced-width:
    title: 10.3.6 Floating, replaced elements
    status: supported
  visudet.html#abs-non-replaced-width:
    title: 10.3.7 Absolutely positioned, non-replaced elements
    status: partial
    gaps:
      - With 'left' and 'right' set, an auto width is 0 instead of filling the space between them
      - The shrink-to-fit width of an auto width box is computed before its content is measured, on the first layout it's 0 or NaN
      - With 'left', 'right' and 'width' set, auto margins compute to 0 instead of centering the box
  visudet.html#abs-replaced-width:
    title: 10.3.8 Absolutely positioned, replaced elements
    status: supported
  visudet.html#inlineblock-width:
    title: 10.3.9 'Inline-block', non-replaced elements in normal flow
    status: partial
    gaps:
      - An auto width inline-block is flowed like an inline, content too wide for the line wraps across lines instead of shrinking the box to the available width
  visudet.html#inlineblock-replaced-width:
    title: 10.3.10 'Inline-block', replaced elements in normal flow
    status: supported
  visudet.html#min-max-widths:
    title: 10.4 Minimum and maximum widths
    status: partial
    gaps:
      - "'min-width' is ignored"
      - "'max-width' only applies to images, it's ignored on non-replaced boxes"
  visudet.html#the-height-property:
    title: 10.5 Content height
    status: partial
    gaps:
      - Percentage heights compute to auto even when the containing block has an explicit height
      - Negative heights are applied instead of being rejected
      - "'height' is ignored on inline-block boxes"
  visudet.html#Computing_heights_and_margins:
    title: 10.6 Calculating heights and margins
    status: partial
  visudet.html#inline-non-replaced:
    title: 10.6.1 Inline, non-replaced elements
    status: partial
    gaps:
      - Vertical padding and border of an inline box can push the line's content down and make the line box taller
  visudet.html#inline-replaced-height:
    title: 10.6.2 Inline replaced elements, block-level replaced elements in normal flow, 'inline-block' replaced elements in normal flow and floating replaced elements
    status: partial
    gaps:
      - Heights in units other than px are ignored, the image keeps its intrinsic height
  visudet.html#normal-block:
    title: 10.6.3 Block-level non-replaced elements in normal flow when 'overflow' computes to 'visible'
    status: supported
  visudet.html#abs-non-replaced-height:
    title: 10.6.4 Absolutely positioned, non-replaced elements
    status: partial
    gaps:
      - With 'top' and 'bottom' set, an auto height is the content height instead of filling the space between them
  visudet.html#abs-replaced-height:
    title: 10.6.5 Absolutely positioned, replaced elements
    status: supported
  visudet.html#block-root-margin:
    title: 10.6.6 Complicated cases
    status: partial
    gaps:
      - An inline-block with block-level content is split out of the line like an inline
      - The bottom padding of an inline-block without top padding isn't part of its height
  visudet.html#root-height:
    title: 10.6.7 'Auto' heights for block formatting context roots
    status: partial
    gaps:
      - The auto height of a block formatting context root doesn't grow to contain its floats
  visudet.html#min-max-heights:
    title: 10.7 Minimum and maximum heights
    status: partial
    gaps:
      - Percentages are ignored even when the containing block has an explicit height
      - "'min-height' and 'max-height' are ignored on images"
  visudet.html#line-height:
    title: 10.8 Line height calculations
    status: partial
    gaps:
      - Images are aligned with the top of the line instead of sitting on the baseline
      - Vertical margins of an inline-block don't make the line box taller
      - "'line-height' on an inline box is ignored, only the block's own 'line-height' sizes the line"
  visudet.html#leading:
    title: 10.8.1 Leading and half-leading
    status: partial
    gaps:
      - The used line height is 90% of 'line-height'
      - A 'line-height' smaller than the font doesn't make the line shorter
      - No half-leading, the text sits at the top of the line instead of in its middle
      - Percentages compute to 'normal'
      - A number is inherited as the parent's computed length instead of the number
      - "'vertical-align' top, bottom, middle, text-top, text-bottom, lengths and percentages are treated as 'baseline'"
      - "'vertical-align: sub' and 'super' both move the text to the top of the line"
  visufx.html#q11.0:
