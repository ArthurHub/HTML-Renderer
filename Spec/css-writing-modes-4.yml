spec: css-writing-modes-4
title: CSS Writing Modes Level 4
url: https://www.w3.org/TR/css-writing-modes-4/
snapshot: https://www.w3.org/TR/2019/CR-css-writing-modes-4-20190730/
sections:
  '#text-flow':
    title: 1 Introduction to Writing Modes
    status: n/a
  '#text-direction':
    title: 2 Inline Direction and Bidirectionality
    status: partial
  '#direction':
    title: '2.1 Specifying Directionality: the direction property'
    status: partial
    gaps:
      - No Unicode bidirectional algorithm, see 2.4
  '#unicode-bidi':
    title: '2.2 Embeddings and Overrides: the unicode-bidi property'
    status: parsed-only
    gaps:
      - unicode-bidi is ignored, embed, isolate, bidi-override and plaintext don't change the reordering
  '#bidi-example':
    title: 2.3 Example of Bidirectional Text
    status: n/a
  '#bidi-algo':
    title: 2.4 Applying the Bidirectional Reordering Algorithm
    status: partial
    gaps:
      - No Unicode bidirectional algorithm, rtl reverses the order of all words on a line, left-to-right runs included, see CSS 2.1 9.10
  '#bidi-para-direction':
    title: 2.4.1 Bidi Paragraph Embedding Levels
    status: partial
    gaps:
      - plaintext doesn't take the paragraph direction from the text
  '#bidi-control-codes':
    title: 2.4.2 CSS–Unicode Bidi Control Translation, Text Reordering
    status: unsupported
    gaps:
      - An inline element's direction reorders its words although unicode-bidi is normal, see CSS 2.1 9.10
      - isolate and embed don't keep an ltr run together in an rtl line
  '#bidi-atomic-inlines':
    title: 2.4.3 Bidi Treatment of Atomic Inlines
    status: partial
    gaps:
      - An inline-block keeps its place in an rtl line instead of being reordered with the words
  '#bidi-embedding-breaks':
    title: 2.4.4 Paragraph Breaks Within Embeddings and Isolates
    status: unsupported
  '#bidi-box-model':
    title: 2.4.5 Reordering-induced Box Fragmentation
    status: unsupported
  '#bidi-fragmentation':
    title: 2.4.5.1 Conditions of Reordering-induced Box Fragmentation
    status: unsupported
  '#bidi-fragment-boxes':
    title: 2.4.5.2 Box Model of Reordering-induced Box Fragments
    status: unsupported
    gaps:
      - A split inline box in rtl text gets its left border on the first line, see CSS 2.1 8.6
  '#vertical-modes':
    title: 3 Vertical Writing Modes
    status: unsupported
  '#vertical-intro':
    title: 3.1 Introduction to Vertical Writing
    status: n/a
  '#block-flow':
    title: '3.2 Block Flow Direction: the writing-mode property'
    status: unsupported
    gaps:
      - writing-mode isn't accepted, layout is always horizontal-tb
  '#svg-writing-mode':
    title: 3.2.1 Obsolete SVG1.1 writing-mode Values
    status: unsupported
  '#svg-writing-mode-css':
    title: 3.2.1.1 Supporting SVG1.1 writing-mode values in CSS syntax
    status: unsupported
  '#svg-writing-mode-markup':
    title: 3.2.1.2 Supporting SVG1.1 writing-mode values in presentational attributes
    status: unsupported
  '#inline-alignment':
    title: 4 Inline-level Alignment
    status: partial
  '#intro-baselines':
    title: 4.1 Introduction to Baselines
    status: n/a
  '#text-baselines':
    title: 4.2 Text Baselines
    status: partial
    gaps:
      - Only horizontal text, so only the alphabetic baseline is used
  '#replaced-baselines':
    title: 4.3 Atomic Inline Baselines
    status: partial
    gaps:
      - Images are aligned with the top of the line instead of sitting on the baseline, see CSS 2.1 10.8
  '#baseline-alignment':
    title: 4.4 Baseline Alignment
    status: partial
    gaps:
      - vertical-align values other than baseline align like baseline or the top of the line, see CSS 2.1 10.8.1
  '#intro-text-layout':
    title: 5 Introduction to Vertical Text Layout
    status: unsupported
  '#text-orientation':
    title: '5.1 Orienting Text: the text-orientation property'
    status: unsupported
    gaps:
      - text-orientation isn't accepted
  '#vertical-font-features':
    title: 5.1.1 Vertical Typesetting and Font Features
    status: unsupported
  '#vertical-orientations':
    title: 5.1.2 Mixed Vertical Orientations
    status: unsupported
  '#glyph-orientation':
    title: '5.1.3 Obsolete: the SVG1.1 glyph-orientation-vertical property'
    status: unsupported
  '#abstract-box':
    title: 6 Abstract Box Terminology
    status: n/a
  '#logical-to-physical':
    title: 6.4 Abstract-to-Physical Mappings
    status: partial
    gaps:
      - Flow-relative properties always map as horizontal-tb ltr, also when direction is rtl, see css-logical-1
  '#abstract-layout':
    title: 7 Abstract Box Layout
    status: partial
  '#vertical-layout':
    title: 7.1 Principles of Layout in Vertical Writing Modes
    status: unsupported
  '#dimension-mapping':
    title: 7.2 Dimensional Mapping
    status: unsupported
  '#orthogonal-flows':
    title: 7.3 Orthogonal Flows
    status: unsupported
  '#orthogonal-auto':
    title: 7.3.1 Available Space in Orthogonal Flows
    status: unsupported
  '#auto-multicol':
    title: 7.3.2 Auto-sizing Block Containers in Orthogonal Flows
    status: unsupported
  '#orthogonal-layout':
    title: 7.3.3 Auto-sizing Other Orthogonal Flow Roots
    status: unsupported
  '#orthogonal-pagination':
    title: 7.3.4 Fragmenting Orthogonal Flows
    status: unsupported
  '#logical-direction-layout':
    title: 7.4 Flow-Relative Mappings
    status: partial
    gaps:
      - In rtl an over-constrained block ignores margin-right instead of margin-left, see CSS 2.1 10.3.3
      - The initial text-align acts as left in rtl, see CSS 2.1 16.2
  '#line-mappings':
    title: 7.5 Line-Relative Mappings
    status: supported
  '#physical-only':
    title: 7.6 Purely Physical Mappings
    status: supported
  '#principal-flow':
    title: 8 The Principal Writing Mode
    status: unsupported
  '#icb':
    title: 8.1 Propagation to the Initial Containing Block
    status: unsupported
    gaps:
      - Neither writing-mode nor direction of the root or body is propagated to the initial containing block
  '#page-direction':
    title: '8.2 Page Flow: the page progression direction'
    status: unsupported
    gaps:
      - Pages aren't classified as left or right pages, see css-page-3
  '#text-combine':
    title: 9 Glyph Composition
    status: unsupported
  '#text-combine-upright':
    title: '9.1 Horizontal-in-Vertical Composition: the text-combine-upright property'
    status: unsupported
    gaps:
      - text-combine-upright isn't accepted
  '#text-combine-runs':
    title: 9.1.1 Text Run Rules
    status: unsupported
  '#text-combine-layout':
    title: 9.1.2 Layout Rules
    status: unsupported
  '#text-combine-compression':
    title: 9.1.3 Compression Rules
    status: unsupported
  '#text-combine-fullwidth':
    title: 9.1.3.1 Full-width Characters
    status: unsupported
  '#priv-sec':
    title: 10 Privacy and Security Considerations
    status: n/a
