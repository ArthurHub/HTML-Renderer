spec: css-color-4
title: CSS Color Module Level 4
url: https://www.w3.org/TR/css-color-4/
snapshot: https://www.w3.org/TR/2026/CRD-css-color-4-20261103/
sections:
  '#introduction':
    title: 1 Introduction
    status: n/a
  '#terminology':
    title: 2 Color Terminology
    status: n/a
  '#applying-color':
    title: 3 Applying Color in CSS
    status: partial
  '#accessibility':
    title: 3.1 Accessibility and Conveying Information By Color
    status: n/a
  '#the-color-property':
    title: '3.2 Foreground Color: the color property'
    status: supported
  '#transparency':
    title: '3.3 Transparency: the opacity property'
    status: parsed-only
    gaps:
      - "'opacity' is parsed but never applied when painting"
  '#tagged-images':
    title: 3.4 Color Space of Tagged Images
    status: unsupported
    gaps:
      - Images are drawn as the platform decodes them, the renderer doesn't convert embedded color profiles
  '#untagged':
    title: 3.5 Color Spaces of Untagged Colors
    status: supported
  '#color-type':
    title: '4 Representing Colors: the <color> type'
    status: partial
  '#color-syntax':
    title: 4.1 The <color> syntax
    status: partial
  '#color-syntax-modern':
    title: 4.1.1 Modern (Space-separated) Color Function Syntax
    status: partial
    gaps:
      - hsl() and hsla() don't take the modern syntax, the color is transparent
      - The modern rgb() takes neither percentages nor fractions, rgb(100% 0% 0%) is rgb(100 0 0) and rgb(255.5 0 0) is rgb(255 5 0)
      - calc() isn't accepted inside a color function
  '#color-syntax-legacy':
    title: 4.1.2 Legacy (Comma-separated) Color Function Syntax
    status: partial
    gaps:
      - rgb() ignores a fourth (alpha) value, hsl() with four values is transparent, and fractions are split at the dot
      - Invalid color functions are kept, e.g. mixed commas and spaces, an alpha without a slash, numbers mixed with percentages, too few values, and commas in hwb(), lab(), lch(), oklab() and oklch()
  '#alpha-syntax':
    title: '4.2 Representing Transparency in Colors: the <alpha-value> syntax'
    status: partial
    gaps:
      - rgb() and rgba() ignore an alpha after a slash
      - A negative alpha isn't clamped to 0
  '#hue-syntax':
    title: '4.3 Representing Cylindrical-coordinate Hues: the <hue> syntax'
    status: partial
    gaps:
      - A hwb() hue outside 0..360 degrees isn't wrapped around
  '#missing':
    title: 4.4 “Missing” Color Components and the none Keyword
    status: partial
    gaps:
      - none in rgb() or hsl() makes the color transparent, and a missing alpha is treated as 1 instead of 0
  '#powerless':
    title: 4.4.1 “Powerless” Color Components
    status: unsupported
    gaps:
      - A powerless hue of a converted color isn't treated as missing when interpolating
  '#parse-color':
    title: 4.5 Parsing a <color> Value
    status: n/a
  '#numeric-srgb':
    title: 5 sRGB Colors
    status: partial
  '#rgb-functions':
    title: '5.1 The RGB functions: rgb() and rgba()'
    status: partial
    gaps:
      - Out-of-range values aren't clipped, see CSS 2.1 4.3.6
      - rgb() ignores the alpha, see 4.1.2 and 4.2
  '#hex-notation':
    title: '5.2 The RGB Hexadecimal Notations: #RRGGBB'
    status: partial
    gaps:
      - "The alpha of 4 and 8 digit hex colors is rounded to two decimals, #f008 gets an alpha of 135 instead of 136"
  '#color-keywords':
    title: 6 Color Keywords
    status: partial
  '#named-colors':
    title: 6.1 Named Colors
    status: supported
  '#css-system-colors':
    title: 6.2 System Colors
    status: partial
    gaps:
      - The system colors added in Color 4 aren't supported, e.g. Canvas, CanvasText, LinkText, Field, Mark, AccentColor
  '#transparent-color':
    title: 6.3 The transparent keyword
    status: supported
  '#currentcolor-color':
    title: 6.4 The currentcolor keyword
    status: partial
    gaps:
      - currentcolor in other properties than 'color' isn't resolved, a currentcolor background is transparent
      - The initial border color is black instead of currentcolor, see CSS 2.1 8.5.2
  '#the-hsl-notation':
    title: '7 HSL Colors: hsl() and hsla() functions'
    status: partial
    gaps:
      - Only the legacy comma syntax is supported, see 4.1.1
  '#hsl-to-rgb':
    title: 7.1 Converting HSL Colors to sRGB
    status: supported
  '#rgb-to-hsl':
    title: 7.2 Converting sRGB Colors to HSL
    status: supported
  '#hsl-examples':
    title: 7.3 Examples of HSL Colors
    status: n/a
  '#the-hwb-notation':
    title: '8 HWB Colors: hwb() function'
    status: partial
    gaps:
      - The legacy comma syntax is accepted, see 4.1.2
  '#hwb-to-rgb':
    title: 8.1 Converting HWB Colors to sRGB
    status: supported
  '#rgb-to-hwb':
    title: 8.2 Converting sRGB Colors to HWB
    status: supported
  '#hwb-examples':
    title: 8.3 Examples of HWB Colors
    status: n/a
  '#lab-colors':
    title: '9 Device-independent Colors: CIE Lab and LCH, Oklab and OkLCh'
    status: partial
  '#cie-lab':
    title: 9.1 CIE Lab and LCH
    status: supported
  '#ok-lab':
    title: 9.2 Oklab and OkLCh
    status: supported
  '#specifying-lab-lch':
    title: '9.3 Specifying Lab and LCH: the lab() and lch() functional notations'
    status: partial
    gaps:
      - A negative chroma isn't clamped to 0
  '#specifying-oklab-oklch':
    title: '9.4 Specifying Oklab and OkLCh: the oklab() and oklch() functional notations'
    status: supported
  '#lab-to-lch':
    title: 9.5 Converting Lab or Oklab colors to LCH or OkLCh colors
    status: supported
  '#lch-to-lab':
    title: 9.6 Converting LCH or OkLCh colors to Lab or Oklab colors
    status: supported
  '#predefined':
    title: 10 Predefined Color Spaces
    status: partial
  '#color-function':
    title: '10.1 Specifying Predefined Colors: the color() function'
    status: unsupported
    gaps:
      - color() isn't supported, the declaration is dropped
  '#predefined-sRGB':
    title: '10.2 The Predefined sRGB Color Space: the sRGB keyword'
    status: partial
    gaps:
      - Only usable as a color-mix() interpolation space, color() isn't supported
  '#predefined-sRGB-linear':
    title: '10.3 The Predefined Linear-Light sRGB Color Space: the srgb-linear keyword'
    status: partial
    gaps:
      - Only usable as a color-mix() interpolation space, color() isn't supported
  '#predefined-display-p3':
    title: '10.4 The Predefined Display P3 Color Space: the display-p3 keyword'
    status: partial
    gaps:
      - Only usable as a color-mix() interpolation space, color() isn't supported
  '#predefined-display-p3-linear':
    title: '10.5 The Predefined Linear-Light Display P3 Color Space: the display-p3-linear keyword'
    status: unsupported
    gaps:
      - Not supported as an interpolation space, color-mix() interpolates in sRGB instead
  '#predefined-a98-rgb':
    title: '10.6 The Predefined A98 RGB Color Space: the a98-rgb keyword'
    status: unsupported
    gaps:
      - Not supported as an interpolation space, color-mix() interpolates in sRGB instead
  '#predefined-prophoto-rgb':
    title: '10.7 The Predefined ProPhoto RGB Color Space: the prophoto-rgb keyword'
    status: unsupported
    gaps:
      - Not supported as an interpolation space, color-mix() interpolates in sRGB instead
  '#predefined-rec2020':
    title: '10.8 The Predefined ITU-R BT.2020-2 Color Space: the rec2020 keyword'
    status: unsupported
    gaps:
      - Not supported as an interpolation space, color-mix() interpolates in sRGB instead
  '#predefined-xyz':
    title: '10.9 The Predefined CIE XYZ Color Spaces: the xyz-d50, xyz-d65, and xyz keywords'
    status: partial
    gaps:
      - Only usable as a color-mix() interpolation space, color() isn't supported
  '#predefined-to-lab-oklab':
    title: 10.10 Converting Predefined Color Spaces to Lab or Oklab
    status: supported
  '#oklab-lab-to-predefined':
    title: 10.11 Converting Lab or Oklab to Predefined RGB Color Spaces
    status: supported
  '#predefined-to-predefined':
    title: 10.12 Converting Between Predefined RGB Color Spaces
    status: supported
  '#alpha':
    title: 10.13 Simple Alpha Compositing
    status: n/a
  '#color-conversion':
    title: 11 Converting Colors
    status: partial
  '#color-convert-intro':
    title: 11.1 Introduction to Converting Colors
    status: n/a
  '#color-convert-algorithm':
    title: 11.2 Algorithm for Converting Colors
    status: partial
    gaps:
      - Out-of-gamut results are clipped instead of gamut mapped, see 14.2
  '#comparing-color-values':
    title: 12 Comparing <color> Values
