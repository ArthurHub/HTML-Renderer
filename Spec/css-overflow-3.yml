    status: unsupported
  '#overflow-propagation':
    title: 3.3 Overflow Viewport Propagation
    status: partial
    gaps:
      - "'overflow' on the root or body clips that box instead of being applied to the viewport, only pagination treats it as propagated"
  '#smooth-scrolling':
