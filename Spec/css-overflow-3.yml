spec: css-overflow-3
title: CSS Overflow Module Level 3
url: https://www.w3.org/TR/css-overflow-3/
snapshot: https://www.w3.org/TR/2025/WD-css-overflow-3-20251007/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#overflow-concepts':
    title: 2 Overflow Concepts and Terminology
    status: supported
  '#ink':
    title: 2.1 Ink Overflow
    status: supported
  '#scrollable':
    title: 2.2 Scrollable Overflow
    status: supported
  '#scrolling':
    title: 2.3 Scrolling Overflow
    status: n/a
  '#overflow-properties':
    title: 3 Scrolling and Clipping Overflow
    status: partial
  '#overflow-control':
    title: '3.1 Managing Overflow: the overflow-x, overflow-y, and overflow properties'
    status: partial
    gaps:
      - "'hidden' clips at the content edge (widened by 2px on the left) instead of the padding edge, see CSS 2.1 11.1.1"
      - "'scroll' and 'auto' don't clip, they behave like 'visible'"
      - "'clip' is rejected"
      - "'overflow-x' and 'overflow-y' are ignored and 'overflow' only takes a single value"
      - Content overflowing a non-clipping box inside a clipping one is clipped at the content edge of the non-clipping box
      - Absolutely positioned and fixed descendants are clipped even when their containing block is outside the clipping box
      - A box with 'overflow' other than visible doesn't establish an independent formatting context, its floats stick out
  '#scroll-visibility':
    title: 3.1.1 Interaction of visibility and overflow
    status: n/a
  '#corner-clipping':
    title: 3.1.2 Interaction of border-radius and overflow
