spec: css-backgrounds-3
title: CSS Backgrounds and Borders Module Level 3
url: https://www.w3.org/TR/css-backgrounds-3/
snapshot: https://www.w3.org/TR/2024/CRD-css-backgrounds-3-20240311/
sections:
  '#introduction':
    title: 1 Introduction
    status: n/a
  '#backgrounds':
    title: 2 Backgrounds
    status: partial
  '#layering':
    title: 2.1 Layering Multiple Background Images
    status: unsupported
    gaps:
      - Only the first layer of a comma-separated background is painted
  '#background-color':
    title: '2.2 Base Color: the background-color property'
    status: partial
    gaps:
      - The color isn't painted beneath a gradient 'background-image', the gradient replaces it
  '#background-image':
    title: '2.3 Image Sources: the background-image property'
    status: partial
    gaps:
      - Only url() images and linear gradients are painted, radial gradients aren't, see CSS Images 3
  '#background-repeat':
    title: '2.4 Tiling Images: the background-repeat property'
    status: partial
    gaps:
      - The two-value syntax isn't resolved, 'repeat no-repeat' tiles in both directions
      - "'space' and 'round' are painted as 'repeat'"
  '#background-attachment':
    title: '2.5 Affixing Images: the background-attachment property'
    status: partial
    gaps:
      - "'fixed' is ignored, see CSS 2.1 14.2.1"
  '#background-position':
    title: '2.6 Positioning Images: the background-position property'
    status: partial
    gaps:
      - Only keywords are resolved, see CSS 2.1 14.2.1
      - Edge offsets like 'right 10px bottom 20px' aren't resolved
      - "'10px left' and 'top 10px' are accepted, though the first of two values has to be horizontal"
      - Three and four value forms that start with 'top' or 'bottom' are rejected
      - "'center' followed by an offset, like 'left center 10px', is accepted"
  '#bg-position-serialization':
    title: 2.6.1 Serialization of background-position values
    status: n/a
  '#background-clip':
    title: '2.7 Painting Area: the background-clip property'
    status: parsed-only
    gaps:
      - "'background-clip' is ignored, the background is always painted to the border box"
  '#background-origin':
    title: '2.8 Positioning Area: the background-origin property'
    status: parsed-only
    gaps:
      - "'background-origin' is ignored, images are positioned against the border box"
  '#background-size':
    title: '2.9 Sizing Images: the background-size property'
    status: parsed-only
    gaps:
      - "'background-size' is ignored, images are drawn at their natural size"
  '#background':
    title: '2.10 Backgrounds Shorthand: the background property'
    status: partial
    gaps:
      - A single box value only sets 'background-origin', not 'background-clip' too
  '#special-backgrounds':
    title: 2.11 Backgrounds of Special Elements
    status: partial
  '#root-background':
    title: 2.11.1 The Canvas Background and the Root Element
    status: partial
    gaps:
      - The root's background only covers the root box, not the whole canvas, see CSS 2.1 14.2
  '#body-background':
    title: 2.11.2 The Canvas Background and the HTML <body> Element
    status: unsupported
    gaps:
      - The body's background isn't propagated to the canvas, see CSS 2.1 14.2
  '#first-line-background':
    title: 2.11.3 The ::first-line Pseudo-element‘s Background
    status: unsupported
    gaps:
      - "::first-line declarations never apply, see CSS 2.1 5.12.1"
  '#borders':
    title: 3 Borders
    status: partial
  '#border-color':
    title: '3.1 Line Colors: the border-color properties'
    status: partial
    gaps:
      - The initial color is black instead of currentcolor, see CSS 2.1 8.5.2
  '#border-style':
    title: '3.2 Line Patterns: the border-style properties'
    status: partial
    gaps:
      - double, groove and ridge are painted as solid, see CSS 2.1 8.5.3
  '#border-width':
    title: '3.3 Line Thickness: the border-width properties'
    status: partial
    gaps:
      - "'border-style: hidden' keeps the width and the initial width isn't 'medium', see CSS 2.1 8.5.1"
  '#border-shorthands':
    title: 3.4 Border Shorthand Properties
    status: partial
    gaps:
      - "'border' doesn't reset 'border-image'"
  '#corners':
    title: 4 Rounded Corners
    status: partial
  '#border-radius':
    title: '4.1 Curve Radii: the border-radius properties'
    status: partial
    gaps:
      - Negative radii are accepted instead of being rejected
  '#corner-shaping':
    title: 4.2 Corner Shaping
    status: partial
    gaps:
      - A rounded border is stroked along the outer radius moved in by half the border width, so it doesn't follow the outer and inner border curves
  '#corner-clipping':
    title: 4.3 Corner Clipping
    status: partial
    gaps:
      - Background images aren't clipped to the rounded corners
      - Overflowing content is clipped to the rectangular padding box, not to its rounded corners
  '#corner-transitions':
    title: 4.4 Color and Style Transitions
    status: partial
    gaps:
      - Adjoining solid, dotted and dashed borders overlap at the corners instead of meeting at the diagonal
      - A rounded corner is painted entirely in the top or bottom border's color and style
  '#corner-overlap':
    title: 4.5 Overlapping Curves
    status: partial
    gaps:
      - The horizontal and vertical radii are scaled by separate factors, which changes the shape of the corners
  '#border-radius-tables':
    title: 4.6 Effect on Tables
    status: partial
    gaps:
      - "'border-radius' also rounds a table with collapsing borders"
  '#border-images':
    title: 5 Border Images
    status: parsed-only
    gaps:
      - "'border-image' and its longhands are parsed but never painted, the regular border is drawn instead"
  '#border-image-source':
    title: '5.1 Image Source: the border-image-source property'
    status: parsed-only
  '#border-image-slice':
    title: '5.2 Image Slicing: the border-image-slice property'
    status: parsed-only
    gaps:
      - "'fill' on its own and 'fill' between the numbers are accepted, e.g. 'fill' and '10% 30 fill 0 0'"
  '#border-image-width':
    title: '5.3 Drawing Areas: the border-image-width property'
    status: parsed-only
  '#border-image-outset':
    title: '5.4 Edge Overhang: the border-image-outset property'
    status: parsed-only
  '#border-image-repeat':
    title: '5.5 Image Tiling: the border-image-repeat property'
    status: parsed-only
  '#border-image-process':
    title: 5.6 Drawing the Border Image
    status: unsupported
  '#border-image':
    title: '5.7 Border Image Shorthand: the border-image property'
    status: parsed-only
  '#border-image-tables':
    title: 5.8 Effect on Tables
    status: unsupported
  '#misc':
    title: 6 Miscellaneous Effects
    status: parsed-only
  '#box-shadow':
    title: '6.1 Drop Shadows: the box-shadow property'
    status: parsed-only
    gaps:
      - "'box-shadow' is parsed but never painted"
  '#shadow-shape':
    title: 6.1.1 Shadow Shape, Spread, and Knockout
    status: unsupported
  '#shadow-blur':
    title: 6.1.2 Blurring Shadow Edges
    status: unsupported
  '#shadow-layers':
    title: 6.1.3 Layering, Layout, and Other Details
    status: unsupported
  '#levels':
    title: 7 Levels
    status: n/a
  '#changes':
    title: 8 Changes
    status: n/a
  '#acknowledgments':
    title: 9 Acknowledgments
    status: n/a
  '#privacy':
    title: 10 Privacy Considerations
    status: n/a
  '#security':
    title: 11 Security Considerations
    status: n/a
