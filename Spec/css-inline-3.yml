spec: css-inline-3
title: CSS Inline Layout Module Level 3
url: https://www.w3.org/TR/css-inline-3/
snapshot: https://www.w3.org/TR/2024/WD-css-inline-3-20241218/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#model':
    title: 2 Inline Layout Model
    status: partial
  '#line-boxes':
    title: 2.1 Layout of Line Boxes
    status: partial
    gaps:
      - The start padding, border and margin of an inline box are repeated on every line it's split onto, see CSS 2.1 9.4.2
      - A word wider than the line box starts a new line, leaving an empty line above it, see CSS 2.1 9.4.2
  '#line-layout':
    title: 2.2 Layout Within Line Boxes
    status: partial
    gaps:
      - Vertical margins of an inline-block don't make the line box taller, see CSS 2.1 10.8
  '#invisible-line-boxes':
    title: 2.3 Phantom Line Boxes
    status: supported
  '#paint-order':
    title: 2.4 Painting Order
    status: supported
  '#css-metrics':
    title: 3 Baselines and Alignment Metrics
    status: partial
  '#baseline-intro':
    title: 3.1 Introduction to Baselines
    status: n/a
  '#baseline-types':
    title: 3.2 Baselines and Metrics
    status: partial
    gaps:
      - Only the alphabetic baseline, there are no ideographic, central, hanging or math baselines
  '#ascent-descent':
    title: 3.2.1 Ascent and Descent Metrics
    status: supported
  '#font-line-gap':
    title: 3.2.2 Line Gap Metrics
    status: n/a
    gaps:
      - Optional, the adapter's font height decides whether the line gap is included
  '#baseline-tables':
    title: 3.3 Baselines of Glyphs and Boxes
    status: partial
    gaps:
      - Images are aligned with the top of the line instead of sitting on the baseline, see CSS 2.1 10.8
      - An inline-block is aligned by its first line instead of its last line
  '#alignment':
    title: 4 Baseline Alignment
    status: partial
  '#dominant-baseline-property':
    title: '4.1 Dominant Baselines: the dominant-baseline property'
    status: unsupported
    gaps:
      - dominant-baseline isn't accepted
  '#transverse-alignment':
    title: '4.2 Transverse Box Alignment: the vertical-align property'
    status: partial
    gaps:
      - first, last and the alignment-baseline keywords such as central aren't accepted
      - top, bottom, middle, text-top, text-bottom, lengths and percentages align like baseline, see CSS 2.1 10.8.1
      - sub and super both move the text to the top of the line, see CSS 2.1 10.8.1
  '#baseline-source':
    title: '4.2.1 Alignment Baseline Source: the baseline-source longhand'
    status: unsupported
    gaps:
      - baseline-source isn't accepted
  '#alignment-baseline-property':
    title: '4.2.2 Alignment Baseline Type: the alignment-baseline longhand'
    status: unsupported
    gaps:
      - alignment-baseline isn't accepted
  '#alignment-baseline-svg-legacy':
    title: 4.2.2.1 Legacy Values for SVG
    status: unsupported
  '#baseline-shift-property':
    title: '4.2.3 Post-Alignment Shift: the baseline-shift longhand'
    status: unsupported
    gaps:
      - baseline-shift isn't accepted
  '#baseline-shift-svg-legacy':
    title: 4.2.3.1 Legacy Values for SVG
    status: unsupported
  '#line-height':
    title: 5 Logical Heights and Inter-line Spacing
    status: partial
  '#line-height-property':
    title: '5.1 Line Spacing: the line-height property'
    status: partial
    gaps:
      - Negative values are accepted instead of being invalid
      - The used line height is 90% of line-height, see CSS 2.1 10.8.1
      - Percentages compute to normal, see CSS 2.1 10.8.1
      - A number is inherited as the parent's computed length instead of the number, see CSS 2.1 10.8.1
  '#text-edges':
    title: '5.2 Text Edge Metrics: the line-fit-edge property'
    status: unsupported
    gaps:
      - line-fit-edge isn't accepted
  '#inline-height':
    title: 5.3 Calculating the Logical Height Contributions (“Layout Bounds”) of Inline Boxes
    status: partial
    gaps:
      - line-height on an inline box is ignored, only the block's own line-height sizes the line, see CSS 2.1 10.8
      - A line-height smaller than the font doesn't make the line shorter, see CSS 2.1 10.8.1
      - No half-leading, the text sits at the top of the line instead of in its middle, see CSS 2.1 10.8.1
  '#leading-trim':
    title: 6 Trimming Leading Over/Under Text
    status: unsupported
    gaps:
      - text-box, text-box-trim and text-box-edge aren't accepted
  '#text-box-shorthand':
    title: '6.1 Shorthand for Text Box Trimming: the text-box property'
    status: unsupported
  '#text-box-trim':
    title: '6.2 Trimming Over/Under Text: the text-box-trim property'
    status: unsupported
  '#text-box-edge':
    title: '6.3 Text Trimming Metrics: the text-box-edge property'
    status: unsupported
  '#line-fill':
    title: '6.4 Inline Box Drawing Height: the inline-sizing property'
    status: unsupported
    gaps:
      - inline-sizing isn't accepted
  '#initial-letter-styling':
    title: 7 Initial Letters
    status: unsupported
    gaps:
      - initial-letter, initial-letter-align and initial-letter-wrap aren't accepted
