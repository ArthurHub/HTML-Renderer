spec: css-variables-1
title: CSS Custom Properties for Cascading Variables Module Level 1
url: https://www.w3.org/TR/css-variables-1/
snapshot: https://www.w3.org/TR/2022/CR-css-variables-1-20220616/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#defining-variables':
    title: '2 Defining Custom Properties: the --* family of properties'
    status: partial
  '#syntax':
    title: 2.1 Custom Property Value Syntax
    status: supported
  '#guaranteed-invalid':
    title: 2.2 Guaranteed-Invalid Values
    status: partial
    gaps:
      - 'An empty custom property, e.g. --foo: ;, is dropped instead of having a valid empty value'
  '#cycles':
    title: 2.3 Resolving Dependency Cycles
    status: supported
  '#using-variables':
    title: '3 Using Cascading Variables: the var() notation'
    status: partial
    gaps:
      - var() is substituted as text instead of tokens, so var(--gap)px forms a length
      - An empty fallback, var(--a,), counts as no fallback
      - A CSS-wide keyword substituted by var() is applied as a literal value instead of as the keyword
  '#invalid-variables':
    title: 3.1 Invalid Variables
    status: partial
    gaps:
      - A value that doesn't parse after substitution is dropped, so the earlier cascaded value stays instead of the property acting as unset
  '#variables-in-shorthands':
    title: 3.2 Variables in Shorthand Properties
    status: supported
  '#long-variables':
    title: 3.3 Safely Handling Overly-Long Variables
    status: unsupported
