spec: css-namespaces-3
title: CSS Namespaces Module Level 3
url: https://www.w3.org/TR/css-namespaces-3/
snapshot: https://www.w3.org/TR/2014/REC-css-namespaces-3-20140320/
sections:
  '#intro':
    title: 1 Introduction
    status: n/a
  '#conformance':
    title: 2 Conformance
    status: n/a
  '#declaration':
    title: '3 Declaring namespaces: the @namespace rule'
    status: partial
  '#syntax':
    title: 3.1 Syntax
    status: partial
    gaps:
      - A namespace name given as a string is dropped, only url() is kept
  '#scope':
    title: 3.2 Scope
    status: unsupported
  '#prefixes':
    title: 3.3 Declaring Prefixes
    status: unsupported
  '#css-qnames':
    title: 4 CSS Qualified Names
    status: partial
    gaps:
      - A declared prefix never matches, e.g. h|div with h declared as the HTML namespace
      - The wildcard prefix never matches, e.g. *|div and [*|title]
      - An empty prefix on a type selector matches HTML elements, e.g. |div
      - An undeclared prefix doesn't invalidate the selector
